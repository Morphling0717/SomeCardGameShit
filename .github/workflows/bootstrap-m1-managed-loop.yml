name: One-time M1 playable-loop bootstrap

on:
  push:
    branches: ["feature/m1-playable-loop"]
    paths:
      - ".github/workflows/bootstrap-m1-managed-loop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1-playable-loop
          fetch-depth: 0

      - name: Rebase onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rebase origin/main

      - name: Write M1 game model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p client/YGOPro2Overlay/Assets/SomeCardGame/M1
          cat > client/YGOPro2Overlay/Assets/SomeCardGame/M1/ScgsM1Game.cs <<'CS'
          using System;
          using System.Collections.Generic;

          namespace SomeCardGame.M1
          {
              public enum ScgsM1Outcome
              {
                  Playing = 0,
                  PlayerOneWon = 1,
                  PlayerTwoWon = 2,
                  Draw = 3
              }

              public sealed class ScgsM1Card
              {
                  public readonly int Id;
                  public readonly string Name;
                  public readonly int Cost;
                  public readonly int Attack;
                  public readonly int Health;

                  public ScgsM1Card(int id, string name, int cost, int attack, int health)
                  {
                      Id = id;
                      Name = name;
                      Cost = cost;
                      Attack = attack;
                      Health = health;
                  }
              }

              public sealed class ScgsM1Unit
              {
                  public readonly ScgsM1Card Card;
                  public int Attack;
                  public int Health;
                  public int MaximumHealth;
                  public bool Ready;

                  public ScgsM1Unit(ScgsM1Card card)
                  {
                      Card = card;
                      Attack = card.Attack;
                      Health = card.Health;
                      MaximumHealth = card.Health;
                      Ready = false;
                  }
              }

              public sealed class ScgsM1Player
              {
                  public int LeaderHealth;
                  public int MaximumPP;
                  public int CurrentPP;
                  public int Fatigue;
                  public readonly List<ScgsM1Card> Deck;
                  public readonly List<ScgsM1Card> Hand;
                  public readonly ScgsM1Unit[] Board;

                  public ScgsM1Player()
                  {
                      LeaderHealth = ScgsM1Game.StartingLeaderHealth;
                      MaximumPP = 0;
                      CurrentPP = 0;
                      Fatigue = 0;
                      Deck = new List<ScgsM1Card>();
                      Hand = new List<ScgsM1Card>();
                      Board = new ScgsM1Unit[ScgsM1Game.BoardSlots];
                  }
              }

              public sealed class ScgsM1Game
              {
                  public const int StartingLeaderHealth = 25;
                  public const int MaximumPP = 10;
                  public const int MaximumHandSize = 9;
                  public const int BoardSlots = 5;
                  public const int StartingHandSize = 4;

                  private Random random;

                  public readonly ScgsM1Player[] Players;
                  public int CurrentPlayer { get; private set; }
                  public int TurnNumber { get; private set; }
                  public bool AwaitingHandoff { get; private set; }
                  public ScgsM1Outcome Outcome { get; private set; }
                  public string LastAction { get; private set; }

                  public ScgsM1Game()
                  {
                      Players = new ScgsM1Player[2];
                      Reset(1);
                  }

                  public void Reset(int seed)
                  {
                      random = new Random(seed);
                      Players[0] = new ScgsM1Player();
                      Players[1] = new ScgsM1Player();
                      BuildDeck(Players[0], 1000);
                      BuildDeck(Players[1], 2000);
                      Shuffle(Players[0].Deck);
                      Shuffle(Players[1].Deck);
                      DrawCards(0, StartingHandSize);
                      DrawCards(1, StartingHandSize);
                      CurrentPlayer = 0;
                      TurnNumber = 1;
                      Outcome = ScgsM1Outcome.Playing;
                      StartTurn(0, false);
                      AwaitingHandoff = true;
                      LastAction = "Pass the device to Player 1.";
                  }

                  public int OpponentOf(int player)
                  {
                      return 1 - player;
                  }

                  public bool AcknowledgeHandoff(int player)
                  {
                      if (Outcome != ScgsM1Outcome.Playing || !AwaitingHandoff || player != CurrentPlayer)
                      {
                          return false;
                      }
                      AwaitingHandoff = false;
                      LastAction = "Player " + (CurrentPlayer + 1).ToString() + " may act.";
                      return true;
                  }

                  public bool PlayUnit(int handIndex, int boardSlot)
                  {
                      if (!CanCurrentPlayerAct())
                      {
                          return false;
                      }
                      ScgsM1Player player = Players[CurrentPlayer];
                      if (handIndex < 0 || handIndex >= player.Hand.Count)
                      {
                          return false;
                      }
                      if (boardSlot < 0 || boardSlot >= BoardSlots || player.Board[boardSlot] != null)
                      {
                          return false;
                      }
                      ScgsM1Card card = player.Hand[handIndex];
                      if (card.Cost > player.CurrentPP)
                      {
                          return false;
                      }
                      player.CurrentPP -= card.Cost;
                      player.Hand.RemoveAt(handIndex);
                      player.Board[boardSlot] = new ScgsM1Unit(card);
                      LastAction = "Player " + (CurrentPlayer + 1).ToString() + " played " + card.Name + ".";
                      return true;
                  }

                  public bool AttackUnit(int attackerSlot, int defenderSlot)
                  {
                      if (!CanCurrentPlayerAct())
                      {
                          return false;
                      }
                      int defenderPlayer = OpponentOf(CurrentPlayer);
                      ScgsM1Unit attacker = GetUnit(CurrentPlayer, attackerSlot);
                      ScgsM1Unit defender = GetUnit(defenderPlayer, defenderSlot);
                      if (attacker == null || defender == null || !attacker.Ready)
                      {
                          return false;
                      }
                      attacker.Ready = false;
                      int attackerDamage = defender.Attack;
                      int defenderDamage = attacker.Attack;
                      attacker.Health -= attackerDamage;
                      defender.Health -= defenderDamage;
                      LastAction = attacker.Card.Name + " battled " + defender.Card.Name + ".";
                      RemoveDeadUnits();
                      CheckOutcome();
                      return true;
                  }

                  public bool AttackLeader(int attackerSlot)
                  {
                      if (!CanCurrentPlayerAct())
                      {
                          return false;
                      }
                      ScgsM1Unit attacker = GetUnit(CurrentPlayer, attackerSlot);
                      if (attacker == null || !attacker.Ready)
                      {
                          return false;
                      }
                      attacker.Ready = false;
                      int opponent = OpponentOf(CurrentPlayer);
                      Players[opponent].LeaderHealth -= attacker.Attack;
                      LastAction = attacker.Card.Name + " dealt " + attacker.Attack.ToString() + " damage to Player " + (opponent + 1).ToString() + ".";
                      CheckOutcome();
                      return true;
                  }

                  public bool EndTurn()
                  {
                      if (!CanCurrentPlayerAct())
                      {
                          return false;
                      }
                      CurrentPlayer = OpponentOf(CurrentPlayer);
                      TurnNumber += 1;
                      StartTurn(CurrentPlayer, true);
                      AwaitingHandoff = Outcome == ScgsM1Outcome.Playing;
                      if (AwaitingHandoff)
                      {
                          LastAction = "Pass the device to Player " + (CurrentPlayer + 1).ToString() + ".";
                      }
                      return true;
                  }

                  public bool Surrender(int player)
                  {
                      if (Outcome != ScgsM1Outcome.Playing || player < 0 || player > 1)
                      {
                          return false;
                      }
                      Outcome = player == 0 ? ScgsM1Outcome.PlayerTwoWon : ScgsM1Outcome.PlayerOneWon;
                      AwaitingHandoff = false;
                      LastAction = "Player " + (player + 1).ToString() + " surrendered.";
                      return true;
                  }

                  public ScgsM1Unit GetUnit(int player, int slot)
                  {
                      if (player < 0 || player > 1 || slot < 0 || slot >= BoardSlots)
                      {
                          return null;
                      }
                      return Players[player].Board[slot];
                  }

                  public int WinnerIndex()
                  {
                      if (Outcome == ScgsM1Outcome.PlayerOneWon)
                      {
                          return 0;
                      }
                      if (Outcome == ScgsM1Outcome.PlayerTwoWon)
                      {
                          return 1;
                      }
                      return -1;
                  }

                  private bool CanCurrentPlayerAct()
                  {
                      return Outcome == ScgsM1Outcome.Playing && !AwaitingHandoff;
                  }

                  private void StartTurn(int playerIndex, bool drawCard)
                  {
                      ScgsM1Player player = Players[playerIndex];
                      if (player.MaximumPP < MaximumPP)
                      {
                          player.MaximumPP += 1;
                      }
                      player.CurrentPP = player.MaximumPP;
                      int i;
                      for (i = 0; i < BoardSlots; ++i)
                      {
                          if (player.Board[i] != null)
                          {
                              player.Board[i].Ready = true;
                          }
                      }
                      if (drawCard)
                      {
                          DrawCards(playerIndex, 1);
                      }
                  }

                  private void DrawCards(int playerIndex, int amount)
                  {
                      int i;
                      for (i = 0; i < amount; ++i)
                      {
                          DrawOne(playerIndex);
                          if (Outcome != ScgsM1Outcome.Playing)
                          {
                              return;
                          }
                      }
                  }

                  private void DrawOne(int playerIndex)
                  {
                      ScgsM1Player player = Players[playerIndex];
                      if (player.Deck.Count == 0)
                      {
                          player.Fatigue += 1;
                          player.LeaderHealth -= player.Fatigue;
                          LastAction = "Player " + (playerIndex + 1).ToString() + " took " + player.Fatigue.ToString() + " fatigue damage.";
                          CheckOutcome();
                          return;
                      }
                      int last = player.Deck.Count - 1;
                      ScgsM1Card card = player.Deck[last];
                      player.Deck.RemoveAt(last);
                      if (player.Hand.Count < MaximumHandSize)
                      {
                          player.Hand.Add(card);
                      }
                      else
                      {
                          LastAction = card.Name + " was archived because the hand was full.";
                      }
                  }

                  private void RemoveDeadUnits()
                  {
                      int player;
                      int slot;
                      for (player = 0; player < 2; ++player)
                      {
                          for (slot = 0; slot < BoardSlots; ++slot)
                          {
                              ScgsM1Unit unit = Players[player].Board[slot];
                              if (unit != null && unit.Health <= 0)
                              {
                                  Players[player].Board[slot] = null;
                              }
                          }
                      }
                  }

                  private void CheckOutcome()
                  {
                      bool p0Dead = Players[0].LeaderHealth <= 0;
                      bool p1Dead = Players[1].LeaderHealth <= 0;
                      if (p0Dead && p1Dead)
                      {
                          Outcome = ScgsM1Outcome.Draw;
                      }
                      else if (p0Dead)
                      {
                          Outcome = ScgsM1Outcome.PlayerTwoWon;
                      }
                      else if (p1Dead)
                      {
                          Outcome = ScgsM1Outcome.PlayerOneWon;
                      }
                      if (Outcome != ScgsM1Outcome.Playing)
                      {
                          AwaitingHandoff = false;
                      }
                  }

                  private void BuildDeck(ScgsM1Player player, int idBase)
                  {
                      AddCopies(player.Deck, new ScgsM1Card(idBase + 1, "Recruit", 1, 1, 1), 6);
                      AddCopies(player.Deck, new ScgsM1Card(idBase + 2, "Sentry", 2, 2, 3), 6);
                      AddCopies(player.Deck, new ScgsM1Card(idBase + 3, "Striker", 3, 3, 3), 6);
                      AddCopies(player.Deck, new ScgsM1Card(idBase + 4, "Knight", 4, 4, 5), 6);
                      AddCopies(player.Deck, new ScgsM1Card(idBase + 5, "Golem", 5, 5, 6), 6);
                  }

                  private static void AddCopies(List<ScgsM1Card> deck, ScgsM1Card card, int copies)
                  {
                      int i;
                      for (i = 0; i < copies; ++i)
                      {
                          deck.Add(card);
                      }
                  }

                  private void Shuffle(List<ScgsM1Card> cards)
                  {
                      int i;
                      for (i = cards.Count - 1; i > 0; --i)
                      {
                          int j = random.Next(i + 1);
                          ScgsM1Card temp = cards[i];
                          cards[i] = cards[j];
                          cards[j] = temp;
                      }
                  }
              }
          }
          CS

      - name: Write M1 YGOPro2 UI
        shell: bash
        run: |
          set -euo pipefail
          cat > client/YGOPro2Overlay/Assets/SomeCardGame/M1/ScgsM1PlayableLoop.cs <<'CS'
          using System;
          using System.IO;
          using UnityEngine;

          namespace SomeCardGame.M1
          {
              public static class ScgsM1Bootstrap
              {
                  public static void Attach(GameObject host)
                  {
                      if (host == null || !ShouldStart())
                      {
                          return;
                      }
                      if (host.GetComponent<ScgsM1PlayableLoop>() == null)
                      {
                          host.AddComponent<ScgsM1PlayableLoop>();
                      }
                  }

                  public static bool ShouldStart()
                  {
          #if UNITY_EDITOR
                      return true;
          #else
                      string[] args = Environment.GetCommandLineArgs();
                      int i;
                      for (i = 0; i < args.Length; ++i)
                      {
                          if (string.Equals(args[i], "--scgs-m1", StringComparison.OrdinalIgnoreCase))
                          {
                              return true;
                          }
                      }
                      return File.Exists("scgs-m1.flag");
          #endif
                  }
              }

              public sealed class ScgsM1PlayableLoop : MonoBehaviour
              {
                  private ScgsM1Game game;
                  private int selectedHand;
                  private int selectedAttacker;
                  private GUIStyle titleStyle;
                  private GUIStyle centeredStyle;
                  private GUIStyle smallStyle;

                  private void Awake()
                  {
                      ResetGame();
                  }

                  private void ResetGame()
                  {
                      game = new ScgsM1Game();
                      game.Reset(Environment.TickCount);
                      selectedHand = -1;
                      selectedAttacker = -1;
                  }

                  private void EnsureStyles()
                  {
                      if (titleStyle != null)
                      {
                          return;
                      }
                      titleStyle = new GUIStyle(GUI.skin.label);
                      titleStyle.fontSize = 24;
                      titleStyle.alignment = TextAnchor.MiddleCenter;
                      titleStyle.wordWrap = true;

                      centeredStyle = new GUIStyle(GUI.skin.label);
                      centeredStyle.fontSize = 17;
                      centeredStyle.alignment = TextAnchor.MiddleCenter;
                      centeredStyle.wordWrap = true;

                      smallStyle = new GUIStyle(GUI.skin.label);
                      smallStyle.fontSize = 13;
                      smallStyle.wordWrap = true;
                  }

                  private void OnGUI()
                  {
                      EnsureStyles();
                      GUI.depth = -10000;
                      Color oldColor = GUI.color;
                      GUI.color = game.AwaitingHandoff ? new Color(0f, 0f, 0f, 1f) : new Color(0.04f, 0.05f, 0.08f, 0.97f);
                      GUI.Box(new Rect(0f, 0f, Screen.width, Screen.height), string.Empty);
                      GUI.color = Color.white;

                      if (game.AwaitingHandoff)
                      {
                          DrawHandoff();
                      }
                      else if (game.Outcome != ScgsM1Outcome.Playing)
                      {
                          DrawFinished();
                      }
                      else
                      {
                          DrawGame();
                      }
                      GUI.color = oldColor;
                  }

                  private void DrawHandoff()
                  {
                      float width = 520f;
                      float height = 260f;
                      GUILayout.BeginArea(new Rect((Screen.width - width) / 2f, (Screen.height - height) / 2f, width, height), GUI.skin.box);
                      GUILayout.Space(24f);
                      GUILayout.Label("PASS THE DEVICE", titleStyle, GUILayout.Height(45f));
                      GUILayout.Label("Player " + (game.CurrentPlayer + 1).ToString() + ", reveal your hand when the other player cannot see the screen.", centeredStyle, GUILayout.Height(80f));
                      GUILayout.Space(16f);
                      if (GUILayout.Button("REVEAL PLAYER " + (game.CurrentPlayer + 1).ToString() + " HAND", GUILayout.Height(52f)))
                      {
                          game.AcknowledgeHandoff(game.CurrentPlayer);
                          selectedHand = -1;
                          selectedAttacker = -1;
                      }
                      GUILayout.EndArea();
                  }

                  private void DrawFinished()
                  {
                      float width = 540f;
                      float height = 300f;
                      string result = game.Outcome == ScgsM1Outcome.Draw ? "DRAW" : "PLAYER " + (game.WinnerIndex() + 1).ToString() + " WINS";
                      GUILayout.BeginArea(new Rect((Screen.width - width) / 2f, (Screen.height - height) / 2f, width, height), GUI.skin.box);
                      GUILayout.Space(24f);
                      GUILayout.Label(result, titleStyle, GUILayout.Height(60f));
                      GUILayout.Label(game.LastAction, centeredStyle, GUILayout.Height(70f));
                      GUILayout.Space(18f);
                      if (GUILayout.Button("PLAY AGAIN", GUILayout.Height(50f)))
                      {
                          ResetGame();
                      }
                      GUILayout.EndArea();
                  }

                  private void DrawGame()
                  {
                      float margin = 18f;
                      GUILayout.BeginArea(new Rect(margin, margin, Screen.width - margin * 2f, Screen.height - margin * 2f));

                      GUILayout.BeginHorizontal(GUI.skin.box);
                      GUILayout.Label("SCGS M1 LOCAL HOTSEAT", titleStyle, GUILayout.Height(38f));
                      GUILayout.FlexibleSpace();
                      GUILayout.Label("Turn " + game.TurnNumber.ToString() + " | Player " + (game.CurrentPlayer + 1).ToString(), centeredStyle, GUILayout.Width(250f));
                      GUILayout.EndHorizontal();

                      DrawPlayerStatus(game.OpponentOf(game.CurrentPlayer), false);
                      DrawLeaderTarget();
                      DrawBoard(game.OpponentOf(game.CurrentPlayer), false);

                      GUILayout.Space(8f);
                      GUILayout.BeginHorizontal(GUI.skin.box);
                      GUILayout.Label(game.LastAction, smallStyle, GUILayout.Height(34f));
                      GUILayout.EndHorizontal();
                      GUILayout.Space(8f);

                      DrawBoard(game.CurrentPlayer, true);
                      DrawPlayerStatus(game.CurrentPlayer, true);
                      DrawHand();
                      DrawActionBar();

                      GUILayout.EndArea();
                  }

                  private void DrawPlayerStatus(int playerIndex, bool own)
                  {
                      ScgsM1Player player = game.Players[playerIndex];
                      GUILayout.BeginHorizontal(GUI.skin.box);
                      GUILayout.Label((own ? "ACTIVE " : "OPPONENT ") + "PLAYER " + (playerIndex + 1).ToString(), centeredStyle, GUILayout.Width(210f), GUILayout.Height(42f));
                      GUILayout.Label("HP " + Math.Max(0, player.LeaderHealth).ToString() + "/" + ScgsM1Game.StartingLeaderHealth.ToString(), centeredStyle, GUILayout.Width(150f));
                      GUILayout.Label("PP " + player.CurrentPP.ToString() + "/" + player.MaximumPP.ToString(), centeredStyle, GUILayout.Width(140f));
                      GUILayout.Label("Deck " + player.Deck.Count.ToString(), centeredStyle, GUILayout.Width(120f));
                      GUILayout.Label(own ? "Hand " + player.Hand.Count.ToString() : "Hidden hand: " + player.Hand.Count.ToString(), centeredStyle, GUILayout.Width(180f));
                      GUILayout.FlexibleSpace();
                      GUILayout.EndHorizontal();
                  }

                  private void DrawLeaderTarget()
                  {
                      bool previousEnabled = GUI.enabled;
                      GUI.enabled = selectedAttacker >= 0;
                      if (GUILayout.Button(selectedAttacker >= 0 ? "ATTACK OPPONENT LEADER" : "Select a READY unit to attack the leader", GUILayout.Height(38f)))
                      {
                          if (game.AttackLeader(selectedAttacker))
                          {
                              selectedAttacker = -1;
                              selectedHand = -1;
                          }
                      }
                      GUI.enabled = previousEnabled;
                  }

                  private void DrawBoard(int playerIndex, bool own)
                  {
                      GUILayout.BeginHorizontal();
                      int slot;
                      for (slot = 0; slot < ScgsM1Game.BoardSlots; ++slot)
                      {
                          ScgsM1Unit unit = game.GetUnit(playerIndex, slot);
                          string caption;
                          bool canClick = false;

                          if (unit == null)
                          {
                              caption = own && selectedHand >= 0 ? "PLAY HERE" : "EMPTY";
                              canClick = own && selectedHand >= 0;
                          }
                          else
                          {
                              caption = UnitCaption(unit, own && slot == selectedAttacker);
                              canClick = own ? unit.Ready : selectedAttacker >= 0;
                          }

                          bool previousEnabled = GUI.enabled;
                          GUI.enabled = canClick;
                          if (GUILayout.Button(caption, GUILayout.Height(105f), GUILayout.MinWidth(130f)))
                          {
                              if (own)
                              {
                                  if (unit == null && selectedHand >= 0)
                                  {
                                      if (game.PlayUnit(selectedHand, slot))
                                      {
                                          selectedHand = -1;
                                          selectedAttacker = -1;
                                      }
                                  }
                                  else if (unit != null && unit.Ready)
                                  {
                                      selectedAttacker = slot;
                                      selectedHand = -1;
                                  }
                              }
                              else if (unit != null && selectedAttacker >= 0)
                              {
                                  if (game.AttackUnit(selectedAttacker, slot))
                                  {
                                      selectedAttacker = -1;
                                      selectedHand = -1;
                                  }
                              }
                          }
                          GUI.enabled = previousEnabled;
                      }
                      GUILayout.EndHorizontal();
                  }

                  private void DrawHand()
                  {
                      ScgsM1Player player = game.Players[game.CurrentPlayer];
                      GUILayout.BeginHorizontal(GUI.skin.box);
                      GUILayout.Label("HAND", centeredStyle, GUILayout.Width(70f), GUILayout.Height(92f));
                      int index;
                      for (index = 0; index < player.Hand.Count; ++index)
                      {
                          ScgsM1Card card = player.Hand[index];
                          bool affordable = card.Cost <= player.CurrentPP;
                          bool previousEnabled = GUI.enabled;
                          GUI.enabled = affordable;
                          string prefix = index == selectedHand ? "> " : string.Empty;
                          if (GUILayout.Button(prefix + CardCaption(card), GUILayout.Width(125f), GUILayout.Height(88f)))
                          {
                              selectedHand = index;
                              selectedAttacker = -1;
                          }
                          GUI.enabled = previousEnabled;
                      }
                      GUILayout.FlexibleSpace();
                      GUILayout.EndHorizontal();
                  }

                  private void DrawActionBar()
                  {
                      GUILayout.BeginHorizontal(GUI.skin.box);
                      if (GUILayout.Button("CANCEL SELECTION", GUILayout.Height(42f)))
                      {
                          selectedHand = -1;
                          selectedAttacker = -1;
                      }
                      GUILayout.FlexibleSpace();
                      if (GUILayout.Button("SURRENDER", GUILayout.Width(150f), GUILayout.Height(42f)))
                      {
                          game.Surrender(game.CurrentPlayer);
                      }
                      if (GUILayout.Button("END TURN", GUILayout.Width(190f), GUILayout.Height(42f)))
                      {
                          if (game.EndTurn())
                          {
                              selectedHand = -1;
                              selectedAttacker = -1;
                          }
                      }
                      GUILayout.EndHorizontal();
                  }

                  private static string CardCaption(ScgsM1Card card)
                  {
                      return card.Name + "\nCost " + card.Cost.ToString() + "\n" + card.Attack.ToString() + "/" + card.Health.ToString();
                  }

                  private static string UnitCaption(ScgsM1Unit unit, bool selected)
                  {
                      string state = unit.Ready ? "READY" : "EXHAUSTED";
                      string prefix = selected ? "> SELECTED\n" : string.Empty;
                      return prefix + unit.Card.Name + "\n" + unit.Attack.ToString() + "/" + unit.Health.ToString() + " (max " + unit.MaximumHealth.ToString() + ")\n" + state;
                  }
              }
          }
          CS

      - name: Write YGOPro2 patcher and tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/tests tools/unity_stubs scripts
          cat > tools/apply_m1_ygo2.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          EXPECTED_UNITY = "5.6.7f1"


          def copy_tree(source: Path, destination: Path) -> None:
              destination.mkdir(parents=True, exist_ok=True)
              for path in source.rglob("*"):
                  relative = path.relative_to(source)
                  target = destination / relative
                  if path.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(str(path), str(target))


          def patch_program(program_path: Path) -> None:
              raw = program_path.read_bytes()
              has_bom = raw.startswith(b"\xef\xbb\xbf")
              text = raw.decode("utf-8-sig")
              injection = "        SomeCardGame.M1.ScgsM1Bootstrap.Attach(gameObject);"
              if injection in text:
                  if text.count(injection) != 1:
                      raise RuntimeError("Program.cs contains the M1 bootstrap more than once")
                  return
              needle = "        instance = this;\n        initialize();"
              if needle not in text:
                  needle = "        instance = this;\r\n        initialize();"
                  if needle not in text:
                      raise RuntimeError("Could not find the Program.Start bootstrap insertion point")
                  replacement = "        instance = this;\r\n" + injection + "\r\n        initialize();"
              else:
                  replacement = "        instance = this;\n" + injection + "\n        initialize();"
              if text.count(needle) != 1:
                  raise RuntimeError("Program.Start insertion point is ambiguous")
              text = text.replace(needle, replacement)
              encoding = "utf-8-sig" if has_bom else "utf-8"
              program_path.write_text(text, encoding=encoding, newline="")


          def validate_unity_version(target: Path) -> None:
              version_file = target / "ProjectSettings" / "ProjectVersion.txt"
              if not version_file.exists():
                  return
              text = version_file.read_text(encoding="utf-8-sig")
              if EXPECTED_UNITY not in text:
                  raise RuntimeError("Expected Unity " + EXPECTED_UNITY + ", got: " + text.strip())


          def apply(target: Path, skip_base_overlay: bool = False) -> None:
              root = Path(__file__).resolve().parents[1]
              target = target.resolve()
              if not target.exists():
                  raise RuntimeError("YGOPro2 target does not exist: " + str(target))
              validate_unity_version(target)
              if not skip_base_overlay:
                  subprocess.run(
                      [sys.executable, str(root / "tools" / "apply_ygo2_overlay.py"), str(target)],
                      check=True,
                  )
              source = root / "client" / "YGOPro2Overlay" / "Assets" / "SomeCardGame" / "M1"
              destination = target / "Assets" / "SomeCardGame" / "M1"
              copy_tree(source, destination)
              patch_program(target / "Assets" / "SibylSystem" / "Program.cs")
              (target / "SCGS_M1_README.txt").write_text(
                  "SomeCardGameShit M1 local hotseat\n\n"
                  "Unity Editor: open Assets/main.unity; M1 starts automatically.\n"
                  "Windows build: launch the executable with --scgs-m1 or place an empty scgs-m1.flag beside it.\n",
                  encoding="utf-8",
              )


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("target", type=Path)
              parser.add_argument("--skip-base-overlay", action="store_true")
              args = parser.parse_args()
              apply(args.target, args.skip_base_overlay)
              print("M1 overlay applied to " + str(args.target.resolve()))
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
