name: One-time M1 source importer

on:
  push:
    branches: ["feature/m1-playable-loop"]
    paths:
      - ".m1-source.ready"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import verified M1 source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f .m1-source.ready
          cat .m1-source.part-* > /tmp/scgs-m1.tar.xz.b64
          base64 --decode /tmp/scgs-m1.tar.xz.b64 > /tmp/scgs-m1.tar.xz
          tar -xJf /tmp/scgs-m1.tar.xz -C .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f .m1-source.part-* .m1-source.ready .github/workflows/fetch-ygo2-source.yml
          git add -- .github/workflows/ci.yml .gitignore CMakeLists.txt CMakePresets.json LICENSE README.md TEST_REPORT.md THIRD_PARTY_NOTICES.md client docs engine scripts tools upstream
          git commit -m "feat: implement M1 local playable loop"
          git push origin HEAD:feature/m1-playable-loop
