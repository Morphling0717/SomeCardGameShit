          import subprocess
          import sys
          import tempfile
          import unittest
          from pathlib import Path


          class ApplyM1Ygo2Tests(unittest.TestCase):
              def make_target(self, version="5.6.7f1"):
                  temporary = tempfile.TemporaryDirectory()
                  target = Path(temporary.name)
                  (target / "Assets" / "SibylSystem").mkdir(parents=True)
                  (target / "ProjectSettings").mkdir(parents=True)
                  (target / "ProjectSettings" / "ProjectVersion.txt").write_text(
                      "m_EditorVersion: " + version + "\n", encoding="utf-8"
                  )
                  (target / "Assets" / "SibylSystem" / "Program.cs").write_text(
                      "public class Program {\n"
                      "    public object gameObject;\n"
                      "    void Start()\n"
                      "    {\n"
                      "        instance = this;\n"
                      "        initialize();\n"
                      "    }\n"
                      "    static Program instance;\n"
                      "    void initialize() {}\n"
                      "}\n",
                      encoding="utf-8",
                  )
                  return temporary, target

              def run_patcher(self, target, expect_success=True):
                  root = Path(__file__).resolve().parents[2]
                  result = subprocess.run(
                      [sys.executable, str(root / "tools" / "apply_m1_ygo2.py"), str(target), "--skip-base-overlay"],
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                  )
                  if expect_success and result.returncode != 0:
                      self.fail(result.stdout + "\n" + result.stderr)
                  return result

              def test_copies_m1_and_patches_program_once(self):
                  temporary, target = self.make_target()
                  try:
                      self.run_patcher(target)
                      self.run_patcher(target)
                      program = (target / "Assets" / "SibylSystem" / "Program.cs").read_text(encoding="utf-8-sig")
                      self.assertEqual(program.count("ScgsM1Bootstrap.Attach(gameObject)"), 1)
                      self.assertTrue((target / "Assets" / "SomeCardGame" / "M1" / "ScgsM1Game.cs").exists())
                      self.assertTrue((target / "Assets" / "SomeCardGame" / "M1" / "ScgsM1PlayableLoop.cs").exists())
                      self.assertTrue((target / "SCGS_M1_README.txt").exists())
                  finally:
                      temporary.cleanup()

              def test_rejects_wrong_unity_version(self):
                  temporary, target = self.make_target("2022.3.0f1")
                  try:
                      result = self.run_patcher(target, expect_success=False)
                      self.assertNotEqual(result.returncode, 0)
                      self.assertIn("Expected Unity 5.6.7f1", result.stderr)
                  finally:
                      temporary.cleanup()


          if __name__ == "__main__":
              unittest.main()
