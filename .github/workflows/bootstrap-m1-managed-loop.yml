          # M1 status

          **State:** first human-playable local-hotseat candidate.

          The repository now contains an M1 YGOPro2 overlay with leader health, PP, hidden handoffs, fixed hands/decks, five unit slots, unit play, unit/leader attacks, persistent simultaneous combat damage, end turn, surrender, fatigue, win and restart.

          Automated gates cover:

          - the pure managed game-state smoke path;
          - compilation of the Unity-facing C# files against a minimal Unity 5-era API stub;
          - idempotent patching of the locked YGOPro2 `Program.cs` startup path;
          - rejection of the wrong Unity project version;
          - all pre-existing M0 C++ tests;
          - application of the overlay to the real locked upstream source.

          What automation cannot honestly prove is the visual result of launching Unity 5.6.7 on a human desktop. The source is a playable candidate, but a captured Windows/editor run remains the final visual acceptance step before calling M1 fully signed off.
          MD

