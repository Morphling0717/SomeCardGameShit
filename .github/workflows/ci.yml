name: CI

on:
  push:
    branches: [main, "prototype/**", "feature/**", "codex/**"]
  pull_request:

concurrency:
  # Keep push and PR events isolated, and key by commit so that a docs-only
  # follow-up can never cancel the last full-matrix evidence for its parent.
  group: fast-ci-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      full_ci: ${{ steps.changes.outputs.full_ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Classify changed paths and check whitespace
        id: changes
        env:
          SCGS_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SCGS_HEAD_SHA: ${{ github.sha }}
        run: >-
          python scripts/ci/classify_ci_changes.py
          --base "$SCGS_BASE_SHA"
          --head "$SCGS_HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"
          --check-whitespace
      - name: Validate CI routing contracts
        run: python -m unittest scripts.tests.test_ci_workflows
      - name: Validate locked product deck schema and manifest
        run: python scripts/ci/validate_product_decks_v1.py
      - name: Verify committed product catalog generation
        run: python scripts/design/generate_product_catalog_v2.py --check
      - name: Audit visual manifests
        run: python scripts/audit_visual_assets.py

  linux-gcc:
    needs: classify-changes
    if: >-
      (github.event_name == 'push' ||
       needs.classify-changes.outputs.full_ci == 'true') &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.head_ref, 'codex/') ||
         startsWith(github.head_ref, 'prototype/') ||
         startsWith(github.head_ref, 'feature/')))
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
      SCGS_SMOKE_SEEDS: "2048"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Configure
        run: >-
          cmake -S . -B build/ci-gcc -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSCGS_WARNINGS_AS_ERRORS=ON
          -DSCGS_ENABLE_LEGACY_YGO2_TESTS=ON
      - name: Build
        run: cmake --build build/ci-gcc --parallel 2
      - name: Test
        run: ctest --test-dir build/ci-gcc --output-on-failure
      - name: Stage install
        run: cmake --install build/ci-gcc --prefix "${GITHUB_WORKSPACE}/build/stage-gcc"
      - name: Verify installed CMake package
        run: |
          cmake -S scripts/native-package-smoke -B build/package-smoke-gcc -G Ninja -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/build/stage-gcc"
          cmake --build build/package-smoke-gcc --parallel 2
          ./build/package-smoke-gcc/scgs_native_v04_package_smoke
          ./build/package-smoke-gcc/scgs_native_v05_package_smoke
      - name: Audit v04 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-gcc/lib/libscgs_v04.so --architecture x86_64
      - name: Audit v05 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-gcc/lib/libscgs_v05.so --architecture x86_64 --api-version v05
      - name: Audit Gate 4B generated visual inventory
        run: python scripts/audit_visual_assets.py
      - name: Check patch whitespace
        run: git diff --check
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v04-linux-x86_64-gcc
          path: build/stage-gcc
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v05-linux-x86_64-gcc
          path: build/stage-gcc
          if-no-files-found: error

  linux-clang-sanitizers:
    needs: classify-changes
    if: >-
      (github.event_name == 'push' ||
       needs.classify-changes.outputs.full_ci == 'true') &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.head_ref, 'codex/') ||
         startsWith(github.head_ref, 'prototype/') ||
         startsWith(github.head_ref, 'feature/')))
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      SCGS_SMOKE_SEEDS: "256"
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Configure
        run: >-
          cmake -S . -B build/ci-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSCGS_WARNINGS_AS_ERRORS=ON
          -DSCGS_ENABLE_SANITIZERS=ON
          -DSCGS_ENABLE_LEGACY_YGO2_TESTS=ON
      - name: Build
        run: cmake --build build/ci-asan --parallel 2
      - name: Test
        run: ctest --test-dir build/ci-asan --output-on-failure
      - name: Stage install
        run: cmake --install build/ci-asan --prefix "${GITHUB_WORKSPACE}/build/stage-asan"
      - name: Verify installed CMake package
        run: |
          cmake -S scripts/native-package-smoke -B build/package-smoke-asan -G Ninja -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/build/stage-asan" -DSCGS_NATIVE_SMOKE_USE_CXX_LINKER=ON -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/package-smoke-asan --parallel 2
          ./build/package-smoke-asan/scgs_native_v04_package_smoke
          ./build/package-smoke-asan/scgs_native_v05_package_smoke
      - name: Audit v04 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-asan/lib/libscgs_v04.so --architecture x86_64
      - name: Audit v05 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-asan/lib/libscgs_v05.so --architecture x86_64 --api-version v05
      - name: Check patch whitespace
        run: git diff --check
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v04-linux-x86_64-clang-asan-ubsan
          path: build/stage-asan
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v05-linux-x86_64-clang-asan-ubsan
          path: build/stage-asan
          if-no-files-found: error

  windows-msvc:
    needs: classify-changes
    if: >-
      (github.event_name == 'push' ||
       needs.classify-changes.outputs.full_ci == 'true') &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.head_ref, 'codex/') ||
         startsWith(github.head_ref, 'prototype/') ||
         startsWith(github.head_ref, 'feature/')))
    runs-on: windows-latest
    env:
      SCGS_SMOKE_SEEDS: "2048"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Configure
        run: >-
          cmake -S . -B build/ci-msvc -A x64
          -DSCGS_WARNINGS_AS_ERRORS=ON
          -DSCGS_ENABLE_LEGACY_YGO2_TESTS=ON
      - name: Build
        shell: pwsh
        run: |
          $log = cmake --build build/ci-msvc --config Release --parallel 2 2>&1
          $log | ForEach-Object { Write-Output $_ }
          $exit = $LASTEXITCODE
          $log | Select-String -Pattern "error" | ForEach-Object { "::error::$($_.Line)" }
          $log | Select-String -Pattern "warning" | ForEach-Object { "::warning::$($_.Line)" }
          exit $exit
      - name: Test
        run: ctest --test-dir build/ci-msvc -C Release --output-on-failure
      - name: Stage install
        run: cmake --install build/ci-msvc --config Release --prefix "${{ github.workspace }}/build/stage-msvc"
      - name: Verify installed CMake package
        shell: pwsh
        run: |
          cmake -S scripts/native-package-smoke -B build/package-smoke-msvc -A x64 -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/stage-msvc"
          cmake --build build/package-smoke-msvc --config Release --parallel 2
          $env:PATH = "${{ github.workspace }}\build\stage-msvc\bin;$env:PATH"
          & "build/package-smoke-msvc/Release/scgs_native_v04_package_smoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "build/package-smoke-msvc/Release/scgs_native_v05_package_smoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit v04 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-msvc/bin/scgs_v04.dll --architecture x86_64
      - name: Audit v05 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-msvc/bin/scgs_v05.dll --architecture x86_64 --api-version v05
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            client/Scgs.Client/packages.lock.json
            client/Scgs.Hotseat/packages.lock.json
            client/Scgs.Client.Tests/packages.lock.json
            client/godot/packages.lock.json
      - name: Cache Godot .NET editor and export templates
        uses: actions/cache@v5
        with:
          path: |
            build/godot-toolchain/windows
            ~/AppData/Roaming/Godot/export_templates/4.7.2.stable.mono
          key: godot-mono-4.7.2-windows-x86_64-v1
      - name: Install verified Godot 4.7.2 .NET toolchain
        id: godot
        shell: pwsh
        run: ./scripts/ci/install_godot_windows.ps1 -GithubOutput $env:GITHUB_OUTPUT
      - name: Stage current-commit native library for Godot
        run: >-
          python scripts/stage_godot_native.py
          --library build/stage-msvc/bin/scgs_v04.dll
          --destination-root client/godot/native
          --target windows-x86_64
      - name: Locked managed restore, build, and tests
        env:
          SCGS_NATIVE_LIBRARY: ${{ github.workspace }}/build/stage-msvc/bin/scgs_v04.dll
          SCGS_V04_NATIVE_PATH: ${{ github.workspace }}/build/stage-msvc/bin/scgs_v04.dll
          SCGS_NATIVE_V05_LIBRARY: ${{ github.workspace }}/build/stage-msvc/bin/scgs_v05.dll
        run: python scripts/ci/run_managed_gate3.py
      - name: AnimeV1 visual slice structural contracts
        run: python -m unittest scripts.tests.test_anime_visual_slice
      - name: Godot headless import
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: >-
          python scripts/ci/run_with_timeout.py
          --timeout 600
          --forbid-output "SCRIPT ERROR:"
          --forbid-output "ERROR:"
          -- "$env:GODOT4" --headless
          --path client/godot --import
      - name: Godot AnimeV1 display-backed structural screenshot matrix
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: >-
          ./scripts/ci/capture_anime_visual_slice.ps1
          -GodotPath $env:GODOT4
          -OutputRoot "${{ github.workspace }}/artifacts/anime-visual-slice/windows"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SomeCardGameShit-gate6a-anime-slice-windows
          path: artifacts/anime-visual-slice/windows
          if-no-files-found: error
      - name: Godot AnimeV1 integrated card-body real-actor slice
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: |
          $slice = Join-Path "${{ github.workspace }}" "artifacts/anime-card-body/windows-1600x900"
          New-Item -ItemType Directory -Path $slice -Force | Out-Null
          python scripts/ci/run_with_timeout.py `
            --timeout 300 `
            --expect-output SCGS_ANIME_CARD_BODY_SLICE_OK `
            --expect-output-count 1 `
            --forbid-output "SCRIPT ERROR:" `
            --forbid-output "ERROR:" `
            --forbid-output "Unhandled exception" `
            -- "$env:GODOT4" --path client/godot --windowed --audio-driver Dummy `
            --resolution "1600x900" -- `
            "--anime-card-body-slice=$slice" --anime-card-body-slice-exit `
            --ci-visual-viewport=1600x900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/validate_anime_card_body_slice.py `
            (Join-Path $slice "anime-card-body-slice.json") `
            --expected-viewport 1600x900
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SomeCardGameShit-gate6a-r1-card-body-windows
          path: artifacts/anime-card-body/windows-1600x900
          if-no-files-found: error
      - name: Godot default 3D current-project native smoke
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: |
          $native = (Resolve-Path "build/stage-msvc/bin/scgs_v04.dll").Path
          $report = Join-Path $env:RUNNER_TEMP "gate4a-current-project-3d-windows.json"
          python scripts/ci/run_with_timeout.py `
            --timeout 180 `
            --expect-output SCGS_GODOT_CI_SMOKE_OK `
            --expect-output-count 1 `
            --forbid-output "SCRIPT ERROR:" `
            --forbid-output "ERROR:" `
            --forbid-output "Unhandled exception" `
            -- "$env:GODOT4" --headless --path client/godot -- `
            --ci-smoke "--native-library=$native" "--ci-report=$report"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/validate_gate4a_report.py --report "$report" --scenario full-match --presentation 3d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export and finalize Windows client
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: |
          $exportDirectory = Join-Path "${{ github.workspace }}" "artifacts/godot/windows-x86_64"
          $export = Join-Path $exportDirectory "SomeCardGameShit.exe"
          New-Item -ItemType Directory -Path $exportDirectory -Force | Out-Null
          python scripts/ci/run_with_timeout.py `
            --timeout 600 `
            --forbid-output "SCRIPT ERROR:" `
            --forbid-output "ERROR:" `
            -- "$env:GODOT4" --headless --path client/godot `
            --export-release "Windows x86-64" "$export"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/finalize_godot_export.py `
            --platform windows-x86_64 `
            --export "$export" `
            --native-library build/stage-msvc/bin/scgs_v04.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit and launch exported Windows default 3D client
        shell: pwsh
        run: |
          $exportDirectory = Join-Path "${{ github.workspace }}" "artifacts/godot/windows-x86_64"
          $export = Join-Path $exportDirectory "SomeCardGameShit.exe"
          $report = Join-Path $env:RUNNER_TEMP "gate4a-export-3d-windows.json"
          python scripts/audit_godot_export.py --platform windows-x86_64 --export "$export"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/run_with_timeout.py `
            --timeout 180 `
            --cwd "$exportDirectory" `
            --expect-output SCGS_GODOT_CI_SMOKE_OK `
            --expect-output-count 1 `
            --forbid-output "SCRIPT ERROR:" `
            --forbid-output "ERROR:" `
            --forbid-output "Unhandled exception" `
            -- "$export" --headless -- --ci-smoke "--ci-report=$report"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/validate_gate4a_report.py --report "$report" --scenario full-match --presentation 3d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows client
        shell: pwsh
        run: |
          $packageDirectory = Join-Path "${{ github.workspace }}" "artifacts/packages"
          $package = Join-Path $packageDirectory "SomeCardGameShit-anime-card-body-r1-windows-x86_64.zip"
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Compress-Archive `
            -Path "artifacts/godot/windows-x86_64/*" `
            -DestinationPath $package `
            -CompressionLevel Optimal
      - name: Round-trip audit and launch packaged Windows default 3D client
        shell: pwsh
        run: |
          $package = Join-Path "${{ github.workspace }}" "artifacts/packages/SomeCardGameShit-anime-card-body-r1-windows-x86_64.zip"
          $roundTrip = Join-Path "${{ github.workspace }}" "artifacts/roundtrip/windows-x86_64"
          New-Item -ItemType Directory -Path $roundTrip -Force | Out-Null
          Expand-Archive -LiteralPath $package -DestinationPath $roundTrip -Force
          $export = Join-Path $roundTrip "SomeCardGameShit.exe"
          $report = Join-Path $env:RUNNER_TEMP "gate4a-roundtrip-3d-windows.json"
          python scripts/audit_godot_export.py `
            --platform windows-x86_64 --export "$export" `
            --require-anime-slice-launcher `
            --require-anime-card-body-launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/run_with_timeout.py `
            --timeout 180 `
            --cwd "$roundTrip" `
            --expect-output SCGS_GODOT_CI_SMOKE_OK `
            --expect-output-count 1 `
            --forbid-output "SCRIPT ERROR:" `
            --forbid-output "ERROR:" `
            --forbid-output "Unhandled exception" `
            -- "$export" --headless -- --ci-smoke "--ci-report=$report"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/validate_gate4a_report.py --report "$report" --scenario full-match --presentation 3d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $cardBodyLauncher = Join-Path $roundTrip "PLAY_ANIME_CARD_BODY_SLICE.cmd"
          $cardBodySlice = Join-Path "${{ github.workspace }}" "artifacts/anime-card-body/packaged-windows-1600x900"
          New-Item -ItemType Directory -Path $cardBodySlice -Force | Out-Null
          $env:SCGS_CARD_BODY_LAUNCHER_CI = "1"
          $env:SCGS_CARD_BODY_LAUNCHER_OUTPUT = $cardBodySlice
          try {
            python scripts/ci/run_with_timeout.py `
              --timeout 300 `
              --cwd "$roundTrip" `
              --expect-output SCGS_ANIME_CARD_BODY_SLICE_OK `
              --expect-output-count 1 `
              --forbid-output "SCRIPT ERROR:" `
              --forbid-output "ERROR:" `
              --forbid-output "Unhandled exception" `
              -- "$env:ComSpec" /d /c call "$cardBodyLauncher"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Remove-Item Env:SCGS_CARD_BODY_LAUNCHER_CI -ErrorAction SilentlyContinue
            Remove-Item Env:SCGS_CARD_BODY_LAUNCHER_OUTPUT -ErrorAction SilentlyContinue
          }
          python scripts/ci/validate_anime_card_body_slice.py `
            (Join-Path $cardBodySlice "anime-card-body-slice.json") `
            --expected-viewport 1600x900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant() | ForEach-Object { "package_sha256=$_" }
      - name: Check patch whitespace
        run: git diff --check
      - uses: actions/upload-artifact@v7
        with:
          name: SomeCardGameShit-anime-card-body-r1-windows-x86_64
          path: artifacts/packages/SomeCardGameShit-anime-card-body-r1-windows-x86_64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SomeCardGameShit-gate6a-r1-card-body-packaged-windows
          path: artifacts/anime-card-body/packaged-windows-1600x900
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v04-windows-x86_64-msvc
          path: build/stage-msvc
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v05-windows-x86_64-msvc
          path: build/stage-msvc
          if-no-files-found: error

  macos-arm64:
    needs: classify-changes
    if: >-
      (github.event_name == 'push' ||
       needs.classify-changes.outputs.full_ci == 'true') &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.head_ref, 'codex/') ||
         startsWith(github.head_ref, 'prototype/') ||
         startsWith(github.head_ref, 'feature/')))
    runs-on: macos-15
    env:
      SCGS_SMOKE_SEEDS: "2048"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v7
      - name: Verify Apple Silicon host
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Configure
        run: >-
          cmake -S . -B build/ci-macos -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DSCGS_WARNINGS_AS_ERRORS=ON
          -DSCGS_ENABLE_LEGACY_YGO2_TESTS=ON
      - name: Build
        run: cmake --build build/ci-macos --parallel 2
      - name: Test
        run: ctest --test-dir build/ci-macos --output-on-failure
      - name: Stage install
        run: cmake --install build/ci-macos --prefix "${GITHUB_WORKSPACE}/build/stage-macos"
      - name: Verify installed CMake package
        run: |
          cmake -S scripts/native-package-smoke -B build/package-smoke-macos -G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/build/stage-macos"
          cmake --build build/package-smoke-macos --parallel 2
          ./build/package-smoke-macos/scgs_native_v04_package_smoke
          ./build/package-smoke-macos/scgs_native_v05_package_smoke
      - name: Audit v04 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-macos/lib/libscgs_v04.dylib --architecture arm64
      - name: Audit v05 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-macos/lib/libscgs_v05.dylib --architecture arm64 --api-version v05
      - name: Audit Gate 4B generated visual inventory
        run: python scripts/audit_visual_assets.py
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            client/Scgs.Client/packages.lock.json
            client/Scgs.Hotseat/packages.lock.json
            client/Scgs.Client.Tests/packages.lock.json
            client/godot/packages.lock.json
      - name: Cache Godot .NET editor and export templates
        uses: actions/cache@v5
        with:
          path: |
            build/godot-toolchain/macos
            ~/Library/Application Support/Godot/export_templates/4.7.2.stable.mono
          key: godot-mono-4.7.2-macos-arm64-v1
      - name: Install verified Godot 4.7.2 .NET toolchain
        id: godot
        run: bash scripts/ci/install_godot_macos.sh
      - name: Prepare derived Godot ARM64 export template
        run: >-
          python scripts/ci/prepare_godot_macos_template.py
          --source "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable.mono/macos.zip"
          --output client/godot/native/macos-arm64/godot_macos_release.arm64.zip
      - name: Stage current-commit native library for Godot
        run: >-
          python scripts/stage_godot_native.py
          --library build/stage-macos/lib/libscgs_v04.dylib
          --destination-root client/godot/native
          --target macos-arm64
      - name: Locked managed restore, build, and tests
        env:
          SCGS_NATIVE_LIBRARY: ${{ github.workspace }}/build/stage-macos/lib/libscgs_v04.dylib
          SCGS_V04_NATIVE_PATH: ${{ github.workspace }}/build/stage-macos/lib/libscgs_v04.dylib
          SCGS_NATIVE_V05_LIBRARY: ${{ github.workspace }}/build/stage-macos/lib/libscgs_v05.dylib
        run: python scripts/ci/run_managed_gate3.py
      - name: AnimeV1 visual slice structural contracts
        run: python -m unittest scripts.tests.test_anime_visual_slice
      - name: Godot headless import
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        run: >-
          python scripts/ci/run_with_timeout.py
          --timeout 600
          --forbid-output "SCRIPT ERROR:"
          --forbid-output "ERROR:"
          -- "$GODOT4" --headless
          --path client/godot --import
      - name: Godot AnimeV1 display-backed structural screenshot matrix
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: >-
          ./scripts/ci/capture_anime_visual_slice.ps1
          -GodotPath $env:GODOT4
          -OutputRoot "${{ github.workspace }}/artifacts/anime-visual-slice/macos"
          -Viewports "1024x684"
          -AllowCiRunnerViewport
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SomeCardGameShit-gate6a-anime-slice-macos-arm64
          path: artifacts/anime-visual-slice/macos
          if-no-files-found: error
      - name: Godot AnimeV1 integrated card-body real-actor slice
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        run: |
          slice="${GITHUB_WORKSPACE}/artifacts/anime-card-body/macos-runner-1024x684"
          mkdir -p "$slice"
          python scripts/ci/run_with_timeout.py \
            --timeout 300 \
            --expect-output SCGS_ANIME_CARD_BODY_SLICE_OK \
            --expect-output-count 1 \
            --forbid-output 'SCRIPT ERROR:' \
            --forbid-output 'ERROR:' \
            --forbid-output 'Unhandled exception' \
            -- "$GODOT4" --path client/godot --windowed --audio-driver Dummy \
            --resolution 1024x684 -- \
            "--anime-card-body-slice=$slice" --anime-card-body-slice-exit \
            --ci-visual-viewport=1024x684 --ci-anime-runner-viewport
          python scripts/ci/validate_anime_card_body_slice.py \
            "$slice/anime-card-body-slice.json" \
            --expected-viewport 1024x684
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SomeCardGameShit-gate6a-r1-card-body-macos-arm64
          path: artifacts/anime-card-body/macos-runner-1024x684
          if-no-files-found: error
      - name: Godot default 3D current-project native smoke
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        run: |
          native="$(cd build/stage-macos/lib && pwd)/libscgs_v04.dylib"
          report="${RUNNER_TEMP}/gate4a-current-project-3d-macos.json"
          python scripts/ci/run_with_timeout.py \
            --timeout 180 \
            --expect-output SCGS_GODOT_CI_SMOKE_OK \
            --expect-output-count 1 \
            --forbid-output 'SCRIPT ERROR:' \
            --forbid-output 'ERROR:' \
            --forbid-output 'Unhandled exception' \
            -- "$GODOT4" --headless --path client/godot -- \
            --ci-smoke "--native-library=${native}" "--ci-report=${report}"
          python scripts/ci/validate_gate4a_report.py --report "$report" --scenario full-match --presentation 3d
      - name: Godot legacy 2D source regression smoke
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        run: |
          native="$(cd build/stage-macos/lib && pwd)/libscgs_v04.dylib"
          report="${RUNNER_TEMP}/gate4a-current-project-legacy-2d-macos.json"
          python scripts/ci/run_with_timeout.py \
            --timeout 180 \
            --expect-output SCGS_GODOT_CI_SMOKE_OK \
            --expect-output-count 1 \
            --forbid-output 'SCRIPT ERROR:' \
            --forbid-output 'ERROR:' \
            --forbid-output 'Unhandled exception' \
            -- "$GODOT4" --headless --path client/godot -- \
            --ci-smoke --legacy-2d-board "--native-library=${native}" "--ci-report=${report}"
          python scripts/ci/validate_gate4a_report.py --report "$report" --scenario full-match --presentation legacy-2d
      - name: Export, finalize, and sign macOS client
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        run: |
          export_directory="${GITHUB_WORKSPACE}/artifacts/godot/macos-arm64"
          app="${export_directory}/SomeCardGameShit.app"
          mkdir -p "$export_directory"
          python scripts/ci/run_with_timeout.py \
            --timeout 600 \
            --forbid-output "SCRIPT ERROR:" \
            --forbid-output "ERROR:" \
            -- "$GODOT4" --headless --path client/godot \
            --export-release "macOS Apple Silicon" "$app"
          python scripts/ci/finalize_godot_export.py \
            --platform macos-arm64 \
            --export "$app" \
            --native-library build/stage-macos/lib/libscgs_v04.dylib
          codesign --force --sign - "$app/Contents/Frameworks/libscgs_v04.dylib"
          codesign --force --deep --sign - "$app"
      - name: Audit and launch exported macOS default 3D client
        run: |
          export_directory="${GITHUB_WORKSPACE}/artifacts/godot/macos-arm64"
          app="${export_directory}/SomeCardGameShit.app"
          executable="$app/Contents/MacOS/SomeCardGameShit"
          report="${RUNNER_TEMP}/gate4a-export-3d-macos.json"
          python scripts/audit_godot_export.py --platform macos-arm64 --export "$app"
          python scripts/ci/run_with_timeout.py \
            --timeout 180 \
            --cwd "$export_directory" \
            --expect-output SCGS_GODOT_CI_SMOKE_OK \
            --expect-output-count 1 \
            --forbid-output 'SCRIPT ERROR:' \
            --forbid-output 'ERROR:' \
            --forbid-output 'Unhandled exception' \
            -- "$executable" --headless -- --ci-smoke "--ci-report=${report}"
          python scripts/ci/validate_gate4a_report.py --report "$report" --scenario full-match --presentation 3d
      - name: Launch exported macOS AnimeV1 visual slice
        run: |
          export_directory="${GITHUB_WORKSPACE}/artifacts/godot/macos-arm64"
          launcher="${export_directory}/PLAY_ANIME_STYLE_SLICE.command"
          slice="${GITHUB_WORKSPACE}/artifacts/anime-exported-visual-slice/macos-runner-1024x684"
          mkdir -p "$slice"
          export SCGS_ANIME_LAUNCHER_CI=1
          export SCGS_ANIME_LAUNCHER_OUTPUT="$slice"
          python scripts/ci/run_with_timeout.py \
            --timeout 300 \
            --cwd "$export_directory" \
            --expect-output SCGS_ANIME_VISUAL_SLICE_READY \
            --expect-output-count 1 \
            --forbid-output 'SCRIPT ERROR:' \
            --forbid-output 'ERROR:' \
            --forbid-output 'Unhandled exception' \
            -- "$launcher"
          unset SCGS_ANIME_LAUNCHER_CI SCGS_ANIME_LAUNCHER_OUTPUT
          python scripts/ci/validate_anime_visual_slice.py \
            "$slice/anime-visual-slice.json" \
            --expected-viewport 1024x684 \
            --allow-ci-runner-viewport
      - name: Package macOS client
        run: |
          export_directory="${GITHUB_WORKSPACE}/artifacts/godot/macos-arm64"
          package_directory="${GITHUB_WORKSPACE}/artifacts/packages"
          r2_package="${package_directory}/SomeCardGameShit-gate4b-r2-macos-arm64.app.zip"
          anime_package="${package_directory}/SomeCardGameShit-anime-card-body-r1-macos-arm64.zip"
          mkdir -p "$package_directory"
          ditto -c -k --sequesterRsrc --keepParent \
            artifacts/godot/macos-arm64/SomeCardGameShit.app \
            "$r2_package"
          cp "$r2_package" "$anime_package"
          (
            cd "$export_directory"
            /usr/bin/zip -q "$anime_package" \
              PLAY_ANIME_STYLE_SLICE.command \
              PLAY_ANIME_CARD_BODY_SLICE.command
          )
      - name: Round-trip launch packaged AnimeV1 visual slice
        run: |
          package="${GITHUB_WORKSPACE}/artifacts/packages/SomeCardGameShit-anime-card-body-r1-macos-arm64.zip"
          round_trip="${GITHUB_WORKSPACE}/artifacts/roundtrip/anime-visual-slice-macos-arm64"
          slice="${GITHUB_WORKSPACE}/artifacts/anime-packaged-visual-slice/macos-runner-1024x684"
          card_body_slice="${GITHUB_WORKSPACE}/artifacts/anime-card-body/packaged-macos-runner-1024x684"
          mkdir -p "$round_trip" "$slice" "$card_body_slice"
          ditto -x -k "$package" "$round_trip"
          app="$round_trip/SomeCardGameShit.app"
          launcher="$round_trip/PLAY_ANIME_STYLE_SLICE.command"
          test -x "$launcher"
          python scripts/audit_godot_export.py \
            --platform macos-arm64 --export "$app" \
            --require-anime-slice-launcher \
            --require-anime-card-body-launcher
          export SCGS_ANIME_LAUNCHER_CI=1
          export SCGS_ANIME_LAUNCHER_OUTPUT="$slice"
          python scripts/ci/run_with_timeout.py \
            --timeout 300 \
            --cwd "$round_trip" \
            --expect-output SCGS_ANIME_VISUAL_SLICE_READY \
            --expect-output-count 1 \
            --forbid-output 'SCRIPT ERROR:' \
            --forbid-output 'ERROR:' \
            --forbid-output 'Unhandled exception' \
            -- "$launcher"
          unset SCGS_ANIME_LAUNCHER_CI SCGS_ANIME_LAUNCHER_OUTPUT
          python scripts/ci/validate_anime_visual_slice.py \
            "$slice/anime-visual-slice.json" \
            --expected-viewport 1024x684 \
            --allow-ci-runner-viewport

          card_body_launcher="$round_trip/PLAY_ANIME_CARD_BODY_SLICE.command"
          test -x "$card_body_launcher"
          export SCGS_CARD_BODY_LAUNCHER_CI=1
          export SCGS_CARD_BODY_LAUNCHER_OUTPUT="$card_body_slice"
          python scripts/ci/run_with_timeout.py \
            --timeout 300 \
            --cwd "$round_trip" \
            --expect-output SCGS_ANIME_CARD_BODY_SLICE_OK \
            --expect-output-count 1 \
            --forbid-output 'SCRIPT ERROR:' \
            --forbid-output 'ERROR:' \
            --forbid-output 'Unhandled exception' \
            -- "$card_body_launcher"
          unset SCGS_CARD_BODY_LAUNCHER_CI SCGS_CARD_BODY_LAUNCHER_OUTPUT
          python scripts/ci/validate_anime_card_body_slice.py \
            "$card_body_slice/anime-card-body-slice.json" \
            --expected-viewport 1024x684
      - name: Round-trip audit and launch packaged macOS default 3D client
        run: |
          package="${GITHUB_WORKSPACE}/artifacts/packages/SomeCardGameShit-gate4b-r2-macos-arm64.app.zip"
          round_trip="${GITHUB_WORKSPACE}/artifacts/roundtrip/macos-arm64"
          mkdir -p "$round_trip"
          ditto -x -k "$package" "$round_trip"
          app="$round_trip/SomeCardGameShit.app"
          executable="$app/Contents/MacOS/SomeCardGameShit"
          report="${RUNNER_TEMP}/gate4a-roundtrip-3d-macos.json"
          python scripts/audit_godot_export.py --platform macos-arm64 --export "$app"
          python scripts/ci/run_with_timeout.py \
