          # M1: first human-playable loop

          M1 is a deliberately small local-hotseat vertical slice inside the locked YGOPro2 Unity 5.6.7 project.

          ## Acceptance scope

          - two human players on one computer;
          - an opaque handoff screen conceals the next player's hand;
          - both players start at 25 leader health;
          - PP grows by one per personal turn and refills, capped at 10;
          - fixed 30-card placeholder decks and four-card starting hands;
          - click a hand card, then an empty unit slot, to play it;
          - five unit slots per player;
          - played units cannot attack until their controller's next turn;
          - click a READY unit, then an enemy unit or the enemy leader, to attack;
          - unit combat deals simultaneous damage and unit damage persists;
          - end turn, surrender, fatigue damage and win screens;
          - restart a completed match without restarting Unity.

          ## Run it

          1. Install Unity 5.6.7f1.
          2. Run `./scripts/bootstrap-upstream.sh`.
          3. Run `python3 tools/apply_m1_ygo2.py vendor/YGOProUnity_V2`.
          4. Open `vendor/YGOProUnity_V2/Assets/main.unity`.

          In the Unity editor the M1 overlay starts automatically. A Windows player build starts it with `--scgs-m1`, or when an empty `scgs-m1.flag` is placed beside the executable.

          ## Honest limitation

          This milestone proves the first human interaction loop in the YGOPro2 client shell. Its placeholder card pool and hotseat state machine are managed C# so the UI can be tested independently. The M0 C++ rules core remains the deeper rules reference, but M1 does not yet claim that every click is executed by a production `ocgcore.dll` bridge. Replacing the managed adapter with the native authoritative bridge is the next integration gate, not something hidden behind the M1 label.
          MD

