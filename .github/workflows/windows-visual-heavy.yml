name: Windows AnimeV1 product visual acceptance

on:
  # Self-validate changes to this heavy lane once. Ordinary product and
  # documentation pushes do not enter the four-resolution product GPU matrix.
  push:
    paths:
      - ".github/workflows/windows-visual-heavy.yml"
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Exact implementation commit to verify
        type: string
        required: false

concurrency:
  group: windows-visual-heavy-${{ github.event_name }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-visual-heavy:
    runs-on: windows-latest
    env:
      SCGS_SMOKE_SEEDS: "2048"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Configure product and protocol-fixture build
        run: >-
          cmake -S . -B build/ci-visual-heavy -A x64
          -DSCGS_WARNINGS_AS_ERRORS=ON
          -DSCGS_ENABLE_LEGACY_YGO2_TESTS=ON
      - name: Build product and protocol-fixture runtimes
        shell: pwsh
        run: |
          $log = cmake --build build/ci-visual-heavy --config Release --parallel 2 2>&1
          $log | ForEach-Object { Write-Output $_ }
          $exit = $LASTEXITCODE
          $log | Select-String -Pattern "error" | ForEach-Object { "::error::$($_.Line)" }
          $log | Select-String -Pattern "warning" | ForEach-Object { "::warning::$($_.Line)" }
          exit $exit
      - name: Run native and legacy contract tests
        run: ctest --test-dir build/ci-visual-heavy -C Release --output-on-failure
      - name: Stage native SDK without test fixtures
        run: >-
          cmake --install build/ci-visual-heavy --config Release
          --prefix "${{ github.workspace }}/build/stage-visual-heavy"
      - name: Audit frozen v04 and v05 libraries
        run: |
          python scripts/audit_native_artifact.py --library build/stage-visual-heavy/bin/scgs_v04.dll --architecture x86_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/audit_native_artifact.py --library build/stage-visual-heavy/bin/scgs_v05.dll --architecture x86_64 --api-version v05
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            client/Scgs.Client/packages.lock.json
            client/Scgs.Hotseat/packages.lock.json
            client/Scgs.Client.Tests/packages.lock.json
            client/godot/packages.lock.json
      - name: Cache Godot .NET editor and export templates
        uses: actions/cache@v5
        with:
          path: |
            build/godot-toolchain/windows
            ~/AppData/Roaming/Godot/export_templates/4.7.2.stable.mono
          key: godot-mono-4.7.2-windows-x86_64-v1
      - name: Install verified Godot 4.7.2 .NET toolchain
        id: godot
        shell: pwsh
        run: ./scripts/ci/install_godot_windows.ps1 -GithubOutput $env:GITHUB_OUTPUT
      - name: Stage same-commit product v05 library for Godot
        run: >-
          python scripts/stage_godot_native.py
          --v05-library build/stage-visual-heavy/bin/scgs_v05.dll
          --destination-root client/godot/native
          --target windows-x86_64
      - name: Restore and build managed clients
        env:
          SCGS_NATIVE_LIBRARY: ${{ github.workspace }}/build/ci-visual-heavy/Release/scgs_v04_fixture.dll
          SCGS_V04_NATIVE_PATH: ${{ github.workspace }}/build/ci-visual-heavy/Release/scgs_v04_fixture.dll
          SCGS_NATIVE_V05_LIBRARY: ${{ github.workspace }}/build/stage-visual-heavy/bin/scgs_v05.dll
        run: python scripts/ci/run_managed_gate3.py
      - name: Godot headless import
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: >-
          python scripts/ci/run_with_timeout.py
          --timeout 600
          --forbid-output "SCRIPT ERROR:"
          --forbid-output "ERROR:"
          -- "$env:GODOT4" --headless
          --path client/godot --import
      - name: Real AnimeV1 product four-resolution visual and heavy-board performance acceptance
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: |
          python -m unittest scripts.tests.test_run_product_smoke scripts.tests.test_validate_product_smoke_report scripts.tests.test_validate_product_visual_report scripts.tests.test_validate_product_privacy_report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path artifacts/product-heavy -Force | Out-Null
          git rev-parse HEAD | Set-Content -LiteralPath artifacts/product-heavy/implementation-sha.txt
          # Preserve evidence from every size even when one bounded case fails.
          # Any failure still fails this job; never replace it with a skipped gate.
          $failedViewports = @()
          foreach ($viewport in @("1280x720", "1600x900", "2560x1440", "2560x1600")) {
            $arguments = @("scripts/ci/run_product_smoke.py", "--executable", "$env:GODOT4", "--project", "client/godot", "--native-library", "build/stage-visual-heavy/bin/scgs_v05.dll", "--artifact", "source", "--coverage", "full-ui", "--viewport", $viewport, "--display", "--capture", "--output", "artifacts/product-heavy/$viewport")
            if ($viewport -eq "1600x900") { $arguments += "--performance" }
            python @arguments
            if ($LASTEXITCODE -ne 0) { $failedViewports += $viewport }
          }
          if ($failedViewports.Count -gt 0) {
            throw "Product visual acceptance failed: $($failedViewports -join ', ')"
          }
      - name: Check patch whitespace
        run: git diff --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SomeCardGameShit-product-playable-v1-visual-evidence
          path: artifacts/product-heavy
          if-no-files-found: warn
