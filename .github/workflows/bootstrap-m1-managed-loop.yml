          using System;
          using SomeCardGame.M1;

          public static class ScgsM1GameSmoke
          {
              private static int assertions;

              private static void Assert(bool condition, string message)
              {
                  assertions += 1;
                  if (!condition)
                  {
                      throw new Exception(message);
                  }
              }

              private static int FindAffordableCard(ScgsM1Game game, int player)
              {
                  int i;
                  for (i = 0; i < game.Players[player].Hand.Count; ++i)
                  {
                      if (game.Players[player].Hand[i].Cost <= game.Players[player].CurrentPP)
                      {
                          return i;
                      }
                  }
                  return -1;
              }

              public static int Main()
              {
                  ScgsM1Game game = new ScgsM1Game();
                  game.Reset(7);
                  Assert(game.CurrentPlayer == 0, "Player 1 should start");
                  Assert(game.Players[0].Hand.Count == 4 && game.Players[1].Hand.Count == 4, "Both players need four cards");
                  Assert(game.Players[0].MaximumPP == 1 && game.Players[0].CurrentPP == 1, "Player 1 needs one PP");
                  Assert(game.AwaitingHandoff, "Opening hand must be concealed");
                  Assert(!game.PlayUnit(0, 0), "Actions must be blocked during handoff");
                  Assert(game.AcknowledgeHandoff(0), "Player 1 should reveal");

                  int card = FindAffordableCard(game, 0);
                  Assert(card >= 0, "Player 1 needs an affordable card");
                  Assert(game.PlayUnit(card, 0), "Player 1 should play a unit");
                  Assert(game.GetUnit(0, 0) != null, "Played unit should be on board");
                  Assert(!game.GetUnit(0, 0).Ready, "New unit must have summoning sickness");
                  Assert(!game.AttackLeader(0), "New unit must not attack");
                  Assert(game.EndTurn(), "Player 1 should end turn");
                  Assert(game.CurrentPlayer == 1 && game.AwaitingHandoff, "Turn should pass safely");
                  Assert(game.Players[1].MaximumPP == 1, "Player 2 first turn needs one PP");
                  Assert(game.AcknowledgeHandoff(1), "Player 2 should reveal");
                  card = FindAffordableCard(game, 1);
                  Assert(card >= 0 && game.PlayUnit(card, 0), "Player 2 should play a unit");
                  Assert(game.EndTurn(), "Player 2 should end turn");
                  Assert(game.AcknowledgeHandoff(0), "Player 1 second reveal");
                  Assert(game.Players[0].MaximumPP == 2 && game.Players[0].CurrentPP == 2, "PP should grow and refill");
                  Assert(game.GetUnit(0, 0).Ready, "Older unit should be ready");

                  int enemyHealth = game.GetUnit(1, 0).Health;
                  int ownAttack = game.GetUnit(0, 0).Attack;
                  Assert(game.AttackUnit(0, 0), "Unit combat should resolve");
                  ScgsM1Unit enemy = game.GetUnit(1, 0);
                  if (enemy != null)
                  {
                      Assert(enemy.Health == enemyHealth - ownAttack, "Unit damage must persist");
                  }

                  game.Reset(11);
                  Assert(game.AcknowledgeHandoff(0), "Fresh Player 1 reveal");
                  card = FindAffordableCard(game, 0);
                  Assert(card >= 0 && game.PlayUnit(card, 0), "Fresh unit play");
                  Assert(game.EndTurn(), "Pass to Player 2");
                  Assert(game.AcknowledgeHandoff(1), "Player 2 reveal");
                  Assert(game.EndTurn(), "Player 2 may pass");
                  Assert(game.AcknowledgeHandoff(0), "Player 1 reveal again");
                  int before = game.Players[1].LeaderHealth;
                  Assert(game.AttackLeader(0), "Ready unit should attack leader");
                  Assert(game.Players[1].LeaderHealth < before, "Leader damage should apply");
                  Assert(game.Surrender(0), "Surrender should finish game");
                  Assert(game.Outcome == ScgsM1Outcome.PlayerTwoWon, "Opponent should win surrender");
                  Assert(!game.EndTurn(), "Finished game must reject actions");

                  Console.WriteLine("M1 managed smoke passed: " + assertions.ToString() + " assertions");
                  return 0;
              }
          }
