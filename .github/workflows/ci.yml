name: CI

on:
  push:
    branches: [main, "prototype/**", "feature/**", "codex/**"]
  pull_request:

concurrency:
  # Keep push and PR events isolated, and key by commit so that a docs-only
  # follow-up can never cancel the last full-matrix evidence for its parent.
  group: fast-ci-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      full_ci: ${{ steps.changes.outputs.full_ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Classify changed paths and check whitespace
        id: changes
        env:
          SCGS_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SCGS_HEAD_SHA: ${{ github.sha }}
        run: >-
          python scripts/ci/classify_ci_changes.py
          --base "$SCGS_BASE_SHA"
          --head "$SCGS_HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"
          --check-whitespace
      - name: Validate CI routing contracts
        run: python -m unittest scripts.tests.test_ci_workflows
      - name: Validate locked product deck schema and manifest
        run: python scripts/ci/validate_product_decks_v1.py
      - name: Verify committed product catalog generation
        run: python scripts/design/generate_product_catalog_v2.py --check
      - name: Audit visual manifests
        run: python scripts/audit_visual_assets.py

  linux-gcc:
    needs: classify-changes
    if: >-
      (github.event_name == 'push' ||
       needs.classify-changes.outputs.full_ci == 'true') &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.head_ref, 'codex/') ||
         startsWith(github.head_ref, 'prototype/') ||
         startsWith(github.head_ref, 'feature/')))
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
      SCGS_SMOKE_SEEDS: "2048"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Configure
        run: >-
          cmake -S . -B build/ci-gcc -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSCGS_WARNINGS_AS_ERRORS=ON
          -DSCGS_ENABLE_LEGACY_YGO2_TESTS=ON
      - name: Build
        run: cmake --build build/ci-gcc --parallel 2
      - name: Test
        run: ctest --test-dir build/ci-gcc --output-on-failure
      - name: Stage install
        run: cmake --install build/ci-gcc --prefix "${GITHUB_WORKSPACE}/build/stage-gcc"
      - name: Verify installed CMake package
        run: |
          cmake -S scripts/native-package-smoke -B build/package-smoke-gcc -G Ninja -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/build/stage-gcc"
          cmake --build build/package-smoke-gcc --parallel 2
          ./build/package-smoke-gcc/scgs_native_v04_package_smoke
          ./build/package-smoke-gcc/scgs_native_v05_package_smoke
      - name: Audit v04 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-gcc/lib/libscgs_v04.so --architecture x86_64
      - name: Audit v05 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-gcc/lib/libscgs_v05.so --architecture x86_64 --api-version v05
      - name: Audit AnimeV1 product visual inventory
        run: python scripts/audit_visual_assets.py
      - name: Check patch whitespace
        run: git diff --check
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v04-linux-x86_64-gcc
          path: build/stage-gcc
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v05-linux-x86_64-gcc
          path: build/stage-gcc
          if-no-files-found: error

  linux-clang-sanitizers:
    needs: classify-changes
    if: >-
      (github.event_name == 'push' ||
       needs.classify-changes.outputs.full_ci == 'true') &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.head_ref, 'codex/') ||
         startsWith(github.head_ref, 'prototype/') ||
         startsWith(github.head_ref, 'feature/')))
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      SCGS_SMOKE_SEEDS: "256"
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Configure
        run: >-
          cmake -S . -B build/ci-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSCGS_WARNINGS_AS_ERRORS=ON
          -DSCGS_ENABLE_SANITIZERS=ON
          -DSCGS_ENABLE_LEGACY_YGO2_TESTS=ON
      - name: Build
        run: cmake --build build/ci-asan --parallel 2
      - name: Test
        run: ctest --test-dir build/ci-asan --output-on-failure
      - name: Stage install
        run: cmake --install build/ci-asan --prefix "${GITHUB_WORKSPACE}/build/stage-asan"
      - name: Verify installed CMake package
        run: |
          cmake -S scripts/native-package-smoke -B build/package-smoke-asan -G Ninja -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/build/stage-asan" -DSCGS_NATIVE_SMOKE_USE_CXX_LINKER=ON -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/package-smoke-asan --parallel 2
          ./build/package-smoke-asan/scgs_native_v04_package_smoke
          ./build/package-smoke-asan/scgs_native_v05_package_smoke
      - name: Audit v04 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-asan/lib/libscgs_v04.so --architecture x86_64
      - name: Audit v05 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-asan/lib/libscgs_v05.so --architecture x86_64 --api-version v05
      - name: Check patch whitespace
        run: git diff --check
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v04-linux-x86_64-clang-asan-ubsan
          path: build/stage-asan
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v05-linux-x86_64-clang-asan-ubsan
          path: build/stage-asan
          if-no-files-found: error

  windows-msvc:
    needs: classify-changes
    if: >-
      (github.event_name == 'push' ||
       needs.classify-changes.outputs.full_ci == 'true') &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.head_ref, 'codex/') ||
         startsWith(github.head_ref, 'prototype/') ||
         startsWith(github.head_ref, 'feature/')))
    runs-on: windows-latest
    env:
      SCGS_SMOKE_SEEDS: "2048"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Configure
        run: >-
          cmake -S . -B build/ci-msvc -A x64
          -DSCGS_WARNINGS_AS_ERRORS=ON
          -DSCGS_ENABLE_LEGACY_YGO2_TESTS=ON
      - name: Build
        shell: pwsh
        run: |
          $log = cmake --build build/ci-msvc --config Release --parallel 2 2>&1
          $log | ForEach-Object { Write-Output $_ }
          $exit = $LASTEXITCODE
          $log | Select-String -Pattern "error" | ForEach-Object { "::error::$($_.Line)" }
          $log | Select-String -Pattern "warning" | ForEach-Object { "::warning::$($_.Line)" }
          exit $exit
      - name: Test
        run: ctest --test-dir build/ci-msvc -C Release --output-on-failure
      - name: Stage install
        run: cmake --install build/ci-msvc --config Release --prefix "${{ github.workspace }}/build/stage-msvc"
      - name: Verify installed CMake package
        shell: pwsh
        run: |
          cmake -S scripts/native-package-smoke -B build/package-smoke-msvc -A x64 -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/stage-msvc"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/package-smoke-msvc --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "${{ github.workspace }}\build\stage-msvc\bin;$env:PATH"
          & "build/package-smoke-msvc/Release/scgs_native_v04_package_smoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "build/package-smoke-msvc/Release/scgs_native_v05_package_smoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit v04 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-msvc/bin/scgs_v04.dll --architecture x86_64
      - name: Audit v05 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-msvc/bin/scgs_v05.dll --architecture x86_64 --api-version v05
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            client/Scgs.Client/packages.lock.json
            client/Scgs.Hotseat/packages.lock.json
            client/Scgs.Client.Tests/packages.lock.json
            client/godot/packages.lock.json
      - name: Cache Godot .NET editor and export templates
        uses: actions/cache@v5
        with:
          path: |
            build/godot-toolchain/windows
            ~/AppData/Roaming/Godot/export_templates/4.7.2.stable.mono
          key: godot-mono-4.7.2-windows-x86_64-v1
      - name: Install verified Godot 4.7.2 .NET toolchain
        id: godot
        shell: pwsh
        run: ./scripts/ci/install_godot_windows.ps1 -GithubOutput $env:GITHUB_OUTPUT
      - name: Stage same-commit product v05 library for Godot
        run: >-
          python scripts/stage_godot_native.py
          --v05-library build/stage-msvc/bin/scgs_v05.dll
          --destination-root client/godot/native
          --target windows-x86_64
      - name: Locked managed restore, build, and tests
        env:
          SCGS_NATIVE_LIBRARY: ${{ github.workspace }}/build/ci-msvc/Release/scgs_v04_fixture.dll
          SCGS_V04_NATIVE_PATH: ${{ github.workspace }}/build/ci-msvc/Release/scgs_v04_fixture.dll
          SCGS_NATIVE_V05_LIBRARY: ${{ github.workspace }}/build/stage-msvc/bin/scgs_v05.dll
        run: python scripts/ci/run_managed_gate3.py
      - name: Product v05 UI report contracts
        run: python -m unittest scripts.tests.test_run_product_smoke scripts.tests.test_validate_product_smoke_report scripts.tests.test_validate_product_visual_report scripts.tests.test_validate_product_privacy_report scripts.tests.test_audit_godot_export
      # Exact-key, CI-produced importer outputs only. Never restore editor,
      # session, Mono, token or whole-.godot state; --import still runs below.
      - name: Cache exact Godot imported assets
        uses: actions/cache@v5
        with:
          path: client/godot/.godot/imported
          key: godot-imported-windows-x86_64-4.7.2-mono-v1-${{ hashFiles('scripts/ci/install_godot_windows.ps1') }}-${{ hashFiles('client/godot/assets/**', 'client/godot/**/*.import', 'client/godot/project.godot', 'client/godot/export_presets.cfg', 'client/godot/addons/**') }}
      - name: Godot headless import
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: >-
          python scripts/ci/run_with_timeout.py --timeout 600
          --forbid-output "SCRIPT ERROR:" --forbid-output "ERROR:"
          -- "$env:GODOT4" --headless --path client/godot --import
      - name: Product v05 current-project full UI and minimum-size smoke
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: |
          python scripts/ci/run_product_smoke.py --executable "$env:GODOT4" --project client/godot --native-library build/stage-msvc/bin/scgs_v05.dll --artifact source --coverage full-ui --viewport 1600x900 --display --output artifacts/product-ui/windows/source-1600
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/run_product_smoke.py --executable "$env:GODOT4" --project client/godot --native-library build/stage-msvc/bin/scgs_v05.dll --artifact source --coverage natural-ui --viewport 1280x720 --display --output artifacts/product-ui/windows/source-1280
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export and finalize v05-only Windows client
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: |
          $directory = Join-Path "${{ github.workspace }}" "artifacts/godot/windows-x86_64"
          $export = Join-Path $directory "SomeCardGameShit.exe"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          python scripts/ci/run_with_timeout.py --timeout 600 --forbid-output "SCRIPT ERROR:" --forbid-output "ERROR:" -- "$env:GODOT4" --headless --path client/godot --export-release "Windows x86-64" "$export"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/finalize_godot_export.py --platform windows-x86_64 --export "$export" --product-native-library build/stage-msvc/bin/scgs_v05.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit and launch exported v05 Windows client
        shell: pwsh
        run: |
          $export = Join-Path "${{ github.workspace }}" "artifacts/godot/windows-x86_64/SomeCardGameShit.exe"
          python scripts/audit_godot_export.py --platform windows-x86_64 --export "$export"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dev/check_godot_mcp_export.py --export "$export"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/run_product_smoke.py --executable "$export" --artifact export --coverage natural-ui --viewport 1600x900 --output artifacts/product-ui/windows/export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows product client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/packages -Force | Out-Null
          Compress-Archive -Path "artifacts/godot/windows-x86_64/*" -DestinationPath artifacts/packages/SomeCardGameShit-product-playable-v1-windows-x86_64.zip -CompressionLevel Optimal
      - name: Round-trip audit and launch packaged v05 Windows client
        shell: pwsh
        run: |
          $package = Join-Path "${{ github.workspace }}" "artifacts/packages/SomeCardGameShit-product-playable-v1-windows-x86_64.zip"
          $roundTrip = Join-Path "${{ github.workspace }}" "artifacts/roundtrip/windows-x86_64"
          Expand-Archive -LiteralPath $package -DestinationPath $roundTrip
          $export = Join-Path $roundTrip "SomeCardGameShit.exe"
          python scripts/audit_godot_export.py --platform windows-x86_64 --export "$export"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dev/check_godot_mcp_export.py --export "$export"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/run_product_smoke.py --executable "$export" --artifact zip --coverage natural-ui --viewport 1600x900 --output artifacts/product-ui/windows/zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant() | ForEach-Object { "package_sha256=$_" }
      - name: Check patch whitespace
        run: git diff --check
      - uses: actions/upload-artifact@v7
        with:
          name: SomeCardGameShit-product-playable-v1-windows-x86_64
          path: artifacts/packages/SomeCardGameShit-product-playable-v1-windows-x86_64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: product-v05-windows-evidence
          path: artifacts/product-ui/windows
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v04-windows-x86_64-msvc
          path: build/stage-msvc
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v05-windows-x86_64-msvc
          path: build/stage-msvc
          if-no-files-found: error

  macos-arm64:
    needs: classify-changes
    if: >-
      (github.event_name == 'push' ||
       needs.classify-changes.outputs.full_ci == 'true') &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.head_ref, 'codex/') ||
         startsWith(github.head_ref, 'prototype/') ||
         startsWith(github.head_ref, 'feature/')))
    runs-on: macos-15
    env:
      SCGS_SMOKE_SEEDS: "2048"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v7
      - name: Verify Apple Silicon host
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Configure
        run: >-
          cmake -S . -B build/ci-macos -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DSCGS_WARNINGS_AS_ERRORS=ON
          -DSCGS_ENABLE_LEGACY_YGO2_TESTS=ON
      - name: Build
        run: cmake --build build/ci-macos --parallel 2
      - name: Test
        run: ctest --test-dir build/ci-macos --output-on-failure
      - name: Stage install
        run: cmake --install build/ci-macos --prefix "${GITHUB_WORKSPACE}/build/stage-macos"
      - name: Verify installed CMake package
        run: |
          cmake -S scripts/native-package-smoke -B build/package-smoke-macos -G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/build/stage-macos"
          cmake --build build/package-smoke-macos --parallel 2
          ./build/package-smoke-macos/scgs_native_v04_package_smoke
          ./build/package-smoke-macos/scgs_native_v05_package_smoke
      - name: Audit v04 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-macos/lib/libscgs_v04.dylib --architecture arm64
      - name: Audit v05 native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-macos/lib/libscgs_v05.dylib --architecture arm64 --api-version v05
      - name: Audit AnimeV1 product visual inventory
        run: python scripts/audit_visual_assets.py
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            client/Scgs.Client/packages.lock.json
            client/Scgs.Hotseat/packages.lock.json
            client/Scgs.Client.Tests/packages.lock.json
            client/godot/packages.lock.json
      - name: Cache Godot .NET editor and export templates
        uses: actions/cache@v5
        with:
          path: |
            build/godot-toolchain/macos
            ~/Library/Application Support/Godot/export_templates/4.7.2.stable.mono
          key: godot-mono-4.7.2-macos-arm64-v1
      - name: Install verified Godot 4.7.2 .NET toolchain
        id: godot
        run: bash scripts/ci/install_godot_macos.sh
      - name: Prepare derived Godot ARM64 export template
        run: >-
          python scripts/ci/prepare_godot_macos_template.py
          --source "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable.mono/macos.zip"
          --output client/godot/native/macos-arm64/godot_macos_release.arm64.zip
      - name: Stage same-commit product v05 library for Godot
        run: >-
          python scripts/stage_godot_native.py
          --v05-library build/stage-macos/lib/libscgs_v05.dylib
          --destination-root client/godot/native
          --target macos-arm64
      - name: Locked managed restore, build, and tests
        env:
          SCGS_NATIVE_LIBRARY: ${{ github.workspace }}/build/ci-macos/libscgs_v04_fixture.dylib
          SCGS_V04_NATIVE_PATH: ${{ github.workspace }}/build/ci-macos/libscgs_v04_fixture.dylib
          SCGS_NATIVE_V05_LIBRARY: ${{ github.workspace }}/build/stage-macos/lib/libscgs_v05.dylib
        run: python scripts/ci/run_managed_gate3.py
      - name: Product v05 UI report contracts
        run: python -m unittest scripts.tests.test_run_product_smoke scripts.tests.test_validate_product_smoke_report scripts.tests.test_validate_product_visual_report scripts.tests.test_validate_product_privacy_report scripts.tests.test_audit_godot_export
      # The installer hash includes the locked official editor/template SHA-512.
      # Cache hits do not replace import validation or source/export/ZIP gates.
      - name: Cache exact Godot imported assets
        uses: actions/cache@v5
        with:
          path: client/godot/.godot/imported
          key: godot-imported-macos-arm64-4.7.2-mono-v1-${{ hashFiles('scripts/ci/install_godot_macos.sh') }}-${{ hashFiles('client/godot/assets/**', 'client/godot/**/*.import', 'client/godot/project.godot', 'client/godot/export_presets.cfg', 'client/godot/addons/**') }}
      - name: Godot headless import
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        # The 66-asset cold ARM64 import was still compressing at 70% when
        # the former 600-second preparation limit elapsed. This is not a
        # gameplay timeout; all source/export/ZIP smoke limits stay unchanged.
        run: >-
          python scripts/ci/run_with_timeout.py --timeout 1800
          --forbid-output "SCRIPT ERROR:" --forbid-output "ERROR:"
          -- "$GODOT4" --headless --path client/godot --import
      - name: Product v05 current-project full UI smoke
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        run: >-
          python scripts/ci/run_product_smoke.py --executable "$GODOT4"
          --project client/godot --native-library build/stage-macos/lib/libscgs_v05.dylib
          --artifact source --coverage full-ui --viewport 1600x900
          --output artifacts/product-ui/macos/source
      - name: Export, finalize, and sign v05-only macOS client
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        run: |
          directory="${GITHUB_WORKSPACE}/artifacts/godot/macos-arm64"
          mkdir -p "$directory"
          app="$directory/SomeCardGameShit.app"
          python scripts/ci/run_with_timeout.py --timeout 600 --forbid-output "SCRIPT ERROR:" --forbid-output "ERROR:" -- "$GODOT4" --headless --path client/godot --export-release "macOS Apple Silicon" "$app"
          python scripts/ci/finalize_godot_export.py --platform macos-arm64 --export "$app" --product-native-library build/stage-macos/lib/libscgs_v05.dylib
          /usr/bin/codesign --force --sign - "$app/Contents/Frameworks/libscgs_v05.dylib"
          /usr/bin/codesign --force --deep --sign - "$app"
      - name: Audit and launch exported v05 macOS client
        run: |
          app="${GITHUB_WORKSPACE}/artifacts/godot/macos-arm64/SomeCardGameShit.app"
          executable="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")"
          python scripts/audit_godot_export.py --platform macos-arm64 --export "$app"
          python scripts/dev/check_godot_mcp_export.py --export "$app"
