name: CI

on:
  push:
    branches: [main, "prototype/**", "feature/**", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
      SCGS_SMOKE_SEEDS: "2048"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Configure
        run: >-
          cmake -S . -B build/ci-gcc -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSCGS_WARNINGS_AS_ERRORS=ON
          -DSCGS_ENABLE_LEGACY_YGO2_TESTS=ON
      - name: Build
        run: cmake --build build/ci-gcc --parallel 2
      - name: Test
        run: ctest --test-dir build/ci-gcc --output-on-failure
      - name: Stage install
        run: cmake --install build/ci-gcc --prefix "${GITHUB_WORKSPACE}/build/stage-gcc"
      - name: Verify installed CMake package
        run: |
          cmake -S scripts/native-package-smoke -B build/package-smoke-gcc -G Ninja -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/build/stage-gcc"
          cmake --build build/package-smoke-gcc --parallel 2
          ./build/package-smoke-gcc/scgs_native_v04_package_smoke
      - name: Audit native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-gcc/lib/libscgs_v04.so --architecture x86_64
      - name: Audit Gate 4B generated visual inventory
        run: python scripts/audit_visual_assets.py
      - name: Check patch whitespace
        run: git diff --check
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v04-linux-x86_64-gcc
          path: build/stage-gcc
          if-no-files-found: error

  linux-clang-sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      SCGS_SMOKE_SEEDS: "256"
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Configure
        run: >-
          cmake -S . -B build/ci-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSCGS_WARNINGS_AS_ERRORS=ON
          -DSCGS_ENABLE_SANITIZERS=ON
          -DSCGS_ENABLE_LEGACY_YGO2_TESTS=ON
      - name: Build
        run: cmake --build build/ci-asan --parallel 2
      - name: Test
        run: ctest --test-dir build/ci-asan --output-on-failure
      - name: Stage install
        run: cmake --install build/ci-asan --prefix "${GITHUB_WORKSPACE}/build/stage-asan"
      - name: Verify installed CMake package
        run: |
          cmake -S scripts/native-package-smoke -B build/package-smoke-asan -G Ninja -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/build/stage-asan" -DSCGS_NATIVE_SMOKE_USE_CXX_LINKER=ON -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/package-smoke-asan --parallel 2
          ./build/package-smoke-asan/scgs_native_v04_package_smoke
      - name: Audit native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-asan/lib/libscgs_v04.so --architecture x86_64
      - name: Check patch whitespace
        run: git diff --check
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v04-linux-x86_64-clang-asan-ubsan
          path: build/stage-asan
          if-no-files-found: error

  windows-msvc:
    runs-on: windows-latest
    env:
      SCGS_SMOKE_SEEDS: "2048"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Configure
        run: >-
          cmake -S . -B build/ci-msvc -A x64
          -DSCGS_WARNINGS_AS_ERRORS=ON
          -DSCGS_ENABLE_LEGACY_YGO2_TESTS=ON
      - name: Build
        shell: pwsh
        run: |
          $log = cmake --build build/ci-msvc --config Release --parallel 2 2>&1
          $log | ForEach-Object { Write-Output $_ }
          $exit = $LASTEXITCODE
          $log | Select-String -Pattern "error" | ForEach-Object { "::error::$($_.Line)" }
          $log | Select-String -Pattern "warning" | ForEach-Object { "::warning::$($_.Line)" }
          exit $exit
      - name: Test
        run: ctest --test-dir build/ci-msvc -C Release --output-on-failure
      - name: Stage install
        run: cmake --install build/ci-msvc --config Release --prefix "${{ github.workspace }}/build/stage-msvc"
      - name: Verify installed CMake package
        shell: pwsh
        run: |
          cmake -S scripts/native-package-smoke -B build/package-smoke-msvc -A x64 -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/stage-msvc"
          cmake --build build/package-smoke-msvc --config Release --parallel 2
          $env:PATH = "${{ github.workspace }}\build\stage-msvc\bin;$env:PATH"
          & "build/package-smoke-msvc/Release/scgs_native_v04_package_smoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-msvc/bin/scgs_v04.dll --architecture x86_64
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            client/Scgs.Client/packages.lock.json
            client/Scgs.Hotseat/packages.lock.json
            client/Scgs.Client.Tests/packages.lock.json
            client/godot/packages.lock.json
      - name: Cache Godot .NET editor and export templates
        uses: actions/cache@v5
        with:
          path: |
            build/godot-toolchain/windows
            ~/AppData/Roaming/Godot/export_templates/4.7.2.stable.mono
          key: godot-mono-4.7.2-windows-x86_64-v1
      - name: Install verified Godot 4.7.2 .NET toolchain
        id: godot
        shell: pwsh
        run: ./scripts/ci/install_godot_windows.ps1 -GithubOutput $env:GITHUB_OUTPUT
      - name: Stage current-commit native library for Godot
        run: >-
          python scripts/stage_godot_native.py
          --library build/stage-msvc/bin/scgs_v04.dll
          --destination-root client/godot/native
          --target windows-x86_64
      - name: Locked managed restore, build, and tests
        env:
          SCGS_NATIVE_LIBRARY: ${{ github.workspace }}/build/stage-msvc/bin/scgs_v04.dll
          SCGS_V04_NATIVE_PATH: ${{ github.workspace }}/build/stage-msvc/bin/scgs_v04.dll
        run: python scripts/ci/run_managed_gate3.py
      - name: Godot headless import
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: >-
          python scripts/ci/run_with_timeout.py
          --timeout 180
          --forbid-output "SCRIPT ERROR:"
          --forbid-output "ERROR:"
          -- "$env:GODOT4" --headless
          --path client/godot --import
      - name: Godot default 3D current-project native smoke
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: |
          $native = (Resolve-Path "build/stage-msvc/bin/scgs_v04.dll").Path
          $report = Join-Path $env:RUNNER_TEMP "gate4a-current-project-3d-windows.json"
          python scripts/ci/run_with_timeout.py `
            --timeout 180 `
            --expect-output SCGS_GODOT_CI_SMOKE_OK `
            --expect-output-count 1 `
            --forbid-output "SCRIPT ERROR:" `
            --forbid-output "ERROR:" `
            --forbid-output "Unhandled exception" `
            -- "$env:GODOT4" --headless --path client/godot -- `
            --ci-smoke "--native-library=$native" "--ci-report=$report"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/validate_gate4a_report.py --report "$report" --scenario full-match --presentation 3d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Godot legacy 2D source regression smoke
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: |
          $native = (Resolve-Path "build/stage-msvc/bin/scgs_v04.dll").Path
          $report = Join-Path $env:RUNNER_TEMP "gate4a-current-project-legacy-2d-windows.json"
          python scripts/ci/run_with_timeout.py `
            --timeout 180 `
            --expect-output SCGS_GODOT_CI_SMOKE_OK `
            --expect-output-count 1 `
            --forbid-output "SCRIPT ERROR:" `
            --forbid-output "ERROR:" `
            --forbid-output "Unhandled exception" `
            -- "$env:GODOT4" --headless --path client/godot -- `
            --ci-smoke --legacy-2d-board "--native-library=$native" "--ci-report=$report"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/validate_gate4a_report.py --report "$report" --scenario full-match --presentation legacy-2d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Godot R3 candidate real-session visual slice
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: |
          $native = (Resolve-Path "build/stage-msvc/bin/scgs_v04.dll").Path
          $slice = Join-Path "${{ github.workspace }}" "artifacts/r3-visual-slice/windows-1600x900"
          New-Item -ItemType Directory -Path $slice -Force | Out-Null
          python scripts/ci/run_with_timeout.py `
            --timeout 300 `
            --expect-output SCGS_R3_VISUAL_SLICE_READY `
            --expect-output-count 1 `
            --forbid-output "SCRIPT ERROR:" `
            --forbid-output "ERROR:" `
            --forbid-output "Unhandled exception" `
            -- "$env:GODOT4" --path client/godot --windowed --audio-driver Dummy `
            --resolution "1600x900" -- `
            "--r3-visual-slice=$slice" --r3-visual-slice-exit `
            "--native-library=$native" "--ci-visual-viewport=1600x900"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/validate_r3_visual_slice.py `
            --report (Join-Path $slice "r3-visual-slice.json") `
            --width 1600 --height 900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SomeCardGameShit-r3-candidate-windows-visual-slice
          path: artifacts/r3-visual-slice
          if-no-files-found: error
      - name: Godot Gate 4B-R2 display-backed visual and performance suite
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: |
          $native = (Resolve-Path "build/stage-msvc/bin/scgs_v04.dll").Path
          $sizes = @(
            @{ Width = 1280; Height = 720 },
            @{ Width = 1600; Height = 900 },
            @{ Width = 2560; Height = 1440 },
            @{ Width = 2560; Height = 1600 }
          )
          foreach ($size in $sizes) {
            $width = $size.Width
            $height = $size.Height
            $suiteTimeout = if ($width -eq 2560) { 2400 } else { 1200 }
            $suite = Join-Path "${{ github.workspace }}" "artifacts/visual-suite/windows-$width`x$height"
            New-Item -ItemType Directory -Path $suite -Force | Out-Null
            # GitHub's Windows image renders Compatibility through ANGLE/WARP.
            # Preserve all 300+300 frames and the full signal-driven match, but
            # allow the two 2560-wide structural runs enough wall-clock time.
            python scripts/ci/run_with_timeout.py `
              --timeout $suiteTimeout `
              --expect-output SCGS_GODOT_CI_SMOKE_OK `
              --expect-output-count 1 `
              --forbid-output "SCRIPT ERROR:" `
              --forbid-output "ERROR:" `
              --forbid-output "Unhandled exception" `
              -- "$env:GODOT4" --path client/godot --windowed --audio-driver Dummy `
              --resolution "$width`x$height" -- `
              --ci-smoke "--native-library=$native" "--ci-visual-suite=$suite" `
              "--ci-visual-viewport=$width`x$height"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $report = Join-Path $suite "visual-suite.json"
            python scripts/ci/validate_gate4b_visual_suite.py `
              --report "$report" --width $width --height $height `
              --asset-manifest client/godot/assets/visual/ASSET_MANIFEST.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($width -eq 1600 -and $height -eq 900) {
              $goldenRoot = Join-Path "${{ github.workspace }}" "client/godot/tests/visual_goldens/gate4b/windows-1600x900"
              $manifest = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
              $goldenMetadataPath = Join-Path $goldenRoot "GOLDEN_METADATA.json"
              python scripts/ci/validate_gate4b_golden_metadata.py `
                --metadata "$goldenMetadataPath" --report "$report"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $goldenMetadata = Get-Content -LiteralPath $goldenMetadataPath -Raw | ConvertFrom-Json
              $approvedStates = @($goldenMetadata.states)
              if ($approvedStates.Count -eq 0 -or
                  @($approvedStates | Sort-Object -Unique).Count -ne $approvedStates.Count) {
                throw "visual golden metadata must list unique approved states"
              }
              foreach ($state in $approvedStates) {
                $matches = @($manifest.captures | Where-Object { $_.state -eq $state })
                if ($matches.Count -ne 1) {
                  throw "visual suite must contain exactly one capture for approved state '$state'"
                }
                $capture = $matches[0]
                $actual = Join-Path $suite $capture.file
                $expected = Join-Path $goldenRoot "$state.png"
                if (-not (Test-Path -LiteralPath $expected -PathType Leaf)) {
                  throw "visual golden metadata references missing capture '$state.png'"
                }
                $expectedCopy = Join-Path $suite "expected/$state.png"
                $heatmap = Join-Path $suite "heatmaps/$state.png"
                New-Item -ItemType Directory -Path (Split-Path $expectedCopy) -Force | Out-Null
                New-Item -ItemType Directory -Path (Split-Path $heatmap) -Force | Out-Null
                Copy-Item -LiteralPath $expected -Destination $expectedCopy -Force
                python scripts/ci/compare_visual_golden.py `
                  --actual "$actual" --expected "$expected" --heatmap "$heatmap" `
                  --mae-limit 0.025 --edge-limit 0.08
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SomeCardGameShit-gate4b-r2-windows-visual-suite
          path: artifacts/visual-suite
          if-no-files-found: error
      - name: Export and finalize Windows client
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        shell: pwsh
        run: |
          $exportDirectory = Join-Path "${{ github.workspace }}" "artifacts/godot/windows-x86_64"
          $export = Join-Path $exportDirectory "SomeCardGameShit.exe"
          New-Item -ItemType Directory -Path $exportDirectory -Force | Out-Null
          python scripts/ci/run_with_timeout.py `
            --timeout 600 `
            --forbid-output "SCRIPT ERROR:" `
            --forbid-output "ERROR:" `
            -- "$env:GODOT4" --headless --path client/godot `
            --export-release "Windows x86-64" "$export"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/finalize_godot_export.py `
            --platform windows-x86_64 `
            --export "$export" `
            --native-library build/stage-msvc/bin/scgs_v04.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit and launch exported Windows default 3D client
        shell: pwsh
        run: |
          $exportDirectory = Join-Path "${{ github.workspace }}" "artifacts/godot/windows-x86_64"
          $export = Join-Path $exportDirectory "SomeCardGameShit.exe"
          $report = Join-Path $env:RUNNER_TEMP "gate4a-export-3d-windows.json"
          python scripts/audit_godot_export.py --platform windows-x86_64 --export "$export"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/run_with_timeout.py `
            --timeout 180 `
            --cwd "$exportDirectory" `
            --expect-output SCGS_GODOT_CI_SMOKE_OK `
            --expect-output-count 1 `
            --forbid-output "SCRIPT ERROR:" `
            --forbid-output "ERROR:" `
            --forbid-output "Unhandled exception" `
            -- "$export" --headless -- --ci-smoke "--ci-report=$report"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/validate_gate4a_report.py --report "$report" --scenario full-match --presentation 3d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch exported Windows R3 candidate visual slice
        shell: pwsh
        run: |
          $exportDirectory = Join-Path "${{ github.workspace }}" "artifacts/godot/windows-x86_64"
          $export = Join-Path $exportDirectory "SomeCardGameShit.exe"
          $slice = Join-Path "${{ github.workspace }}" "artifacts/r3-exported-visual-slice/windows-1600x900"
          New-Item -ItemType Directory -Path $slice -Force | Out-Null
          python scripts/ci/run_with_timeout.py `
            --timeout 300 `
            --cwd "$exportDirectory" `
            --expect-output SCGS_R3_VISUAL_SLICE_READY `
            --expect-output-count 1 `
            --forbid-output "SCRIPT ERROR:" `
            --forbid-output "ERROR:" `
            --forbid-output "Unhandled exception" `
            -- "$export" --windowed --audio-driver Dummy --resolution "1600x900" -- `
            "--r3-visual-slice=$slice" --r3-visual-slice-exit "--ci-visual-viewport=1600x900"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/validate_r3_visual_slice.py `
            --report (Join-Path $slice "r3-visual-slice.json") `
            --width 1600 --height 900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows client
        shell: pwsh
        run: |
          $packageDirectory = Join-Path "${{ github.workspace }}" "artifacts/packages"
          $r2Package = Join-Path $packageDirectory "SomeCardGameShit-gate4b-r2-windows-x86_64.zip"
          $r3Package = Join-Path $packageDirectory "SomeCardGameShit-gate4b-r3-visual-slice-windows-x86_64.zip"
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Compress-Archive `
            -Path "artifacts/godot/windows-x86_64/*" `
            -DestinationPath $r2Package `
            -CompressionLevel Optimal
          Copy-Item -LiteralPath $r2Package -Destination $r3Package
      - name: Round-trip launch packaged Windows R3 visual slice
        shell: pwsh
        run: |
          $package = Join-Path "${{ github.workspace }}" "artifacts/packages/SomeCardGameShit-gate4b-r3-visual-slice-windows-x86_64.zip"
          $roundTrip = Join-Path "${{ github.workspace }}" "artifacts/roundtrip/r3-visual-slice-windows-x86_64"
          $slice = Join-Path "${{ github.workspace }}" "artifacts/r3-packaged-visual-slice/windows-1600x900"
          New-Item -ItemType Directory -Path $roundTrip -Force | Out-Null
          New-Item -ItemType Directory -Path $slice -Force | Out-Null
          Expand-Archive -LiteralPath $package -DestinationPath $roundTrip -Force
          $export = Join-Path $roundTrip "SomeCardGameShit.exe"
          $launcher = Join-Path $roundTrip "PLAY_R3_VISUAL_SLICE.cmd"
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw "The R3 package round trip is missing PLAY_R3_VISUAL_SLICE.cmd."
          }
          $expectedLauncherHash = (Get-FileHash -LiteralPath "scripts/ci/PLAY_R3_VISUAL_SLICE.cmd" -Algorithm SHA256).Hash
          $packagedLauncherHash = (Get-FileHash -LiteralPath $launcher -Algorithm SHA256).Hash
          if ($packagedLauncherHash -ne $expectedLauncherHash) {
            throw "The packaged R3 launcher differs from the finalized source launcher."
          }
          python scripts/audit_godot_export.py --platform windows-x86_64 --export "$export"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SCGS_R3_LAUNCHER_CI = "1"
          $env:SCGS_R3_LAUNCHER_OUTPUT = $slice
          $launcherExitCode = 0
          try {
            python scripts/ci/run_with_timeout.py `
              --timeout 300 `
              --cwd "$roundTrip" `
              --expect-output SCGS_R3_VISUAL_SLICE_READY `
              --expect-output-count 1 `
              --forbid-output "SCRIPT ERROR:" `
              --forbid-output "ERROR:" `
              --forbid-output "Unhandled exception" `
              -- "$env:ComSpec" /d /c call "$launcher"
            $launcherExitCode = $LASTEXITCODE
          }
          finally {
            Remove-Item Env:SCGS_R3_LAUNCHER_CI -ErrorAction SilentlyContinue
            Remove-Item Env:SCGS_R3_LAUNCHER_OUTPUT -ErrorAction SilentlyContinue
          }
          if ($launcherExitCode -ne 0) { exit $launcherExitCode }
          python scripts/ci/validate_r3_visual_slice.py `
            --report (Join-Path $slice "r3-visual-slice.json") `
            --width 1600 --height 900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Round-trip audit and launch packaged Windows default 3D client
        shell: pwsh
        run: |
          $package = Join-Path "${{ github.workspace }}" "artifacts/packages/SomeCardGameShit-gate4b-r2-windows-x86_64.zip"
          $roundTrip = Join-Path "${{ github.workspace }}" "artifacts/roundtrip/windows-x86_64"
          New-Item -ItemType Directory -Path $roundTrip -Force | Out-Null
          Expand-Archive -LiteralPath $package -DestinationPath $roundTrip -Force
          $export = Join-Path $roundTrip "SomeCardGameShit.exe"
          $report = Join-Path $env:RUNNER_TEMP "gate4a-roundtrip-3d-windows.json"
          python scripts/audit_godot_export.py --platform windows-x86_64 --export "$export"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/run_with_timeout.py `
            --timeout 180 `
            --cwd "$roundTrip" `
            --expect-output SCGS_GODOT_CI_SMOKE_OK `
            --expect-output-count 1 `
            --forbid-output "SCRIPT ERROR:" `
            --forbid-output "ERROR:" `
            --forbid-output "Unhandled exception" `
            -- "$export" --headless -- --ci-smoke "--ci-report=$report"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/validate_gate4a_report.py --report "$report" --scenario full-match --presentation 3d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant() | ForEach-Object { "package_sha256=$_" }
      - name: Check patch whitespace
        run: git diff --check
      - uses: actions/upload-artifact@v7
        with:
          name: SomeCardGameShit-gate4b-r2-windows-x86_64
          path: artifacts/packages/SomeCardGameShit-gate4b-r2-windows-x86_64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: SomeCardGameShit-gate4b-r3-visual-slice-windows-x86_64
          path: artifacts/packages/SomeCardGameShit-gate4b-r3-visual-slice-windows-x86_64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: SomeCardGameShit-r3-candidate-windows-packaged-visual-slice
          path: artifacts/r3-packaged-visual-slice
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: SomeCardGameShit-r3-candidate-windows-exported-visual-slice
          path: artifacts/r3-exported-visual-slice
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v04-windows-x86_64-msvc
          path: build/stage-msvc
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-15
    env:
      SCGS_SMOKE_SEEDS: "2048"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v7
      - name: Verify Apple Silicon host
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Configure
        run: >-
          cmake -S . -B build/ci-macos -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DSCGS_WARNINGS_AS_ERRORS=ON
          -DSCGS_ENABLE_LEGACY_YGO2_TESTS=ON
      - name: Build
        run: cmake --build build/ci-macos --parallel 2
      - name: Test
        run: ctest --test-dir build/ci-macos --output-on-failure
      - name: Stage install
        run: cmake --install build/ci-macos --prefix "${GITHUB_WORKSPACE}/build/stage-macos"
      - name: Verify installed CMake package
        run: |
          cmake -S scripts/native-package-smoke -B build/package-smoke-macos -G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/build/stage-macos"
          cmake --build build/package-smoke-macos --parallel 2
          ./build/package-smoke-macos/scgs_native_v04_package_smoke
      - name: Audit native artifact
        run: python scripts/audit_native_artifact.py --library build/stage-macos/lib/libscgs_v04.dylib --architecture arm64
      - name: Audit Gate 4B generated visual inventory
        run: python scripts/audit_visual_assets.py
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            client/Scgs.Client/packages.lock.json
            client/Scgs.Hotseat/packages.lock.json
            client/Scgs.Client.Tests/packages.lock.json
            client/godot/packages.lock.json
      - name: Cache Godot .NET editor and export templates
        uses: actions/cache@v5
        with:
          path: |
            build/godot-toolchain/macos
            ~/Library/Application Support/Godot/export_templates/4.7.2.stable.mono
          key: godot-mono-4.7.2-macos-arm64-v1
      - name: Install verified Godot 4.7.2 .NET toolchain
        id: godot
        run: bash scripts/ci/install_godot_macos.sh
      - name: Prepare derived Godot ARM64 export template
        run: >-
          python scripts/ci/prepare_godot_macos_template.py
          --source "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable.mono/macos.zip"
          --output client/godot/native/macos-arm64/godot_macos_release.arm64.zip
      - name: Stage current-commit native library for Godot
        run: >-
          python scripts/stage_godot_native.py
          --library build/stage-macos/lib/libscgs_v04.dylib
          --destination-root client/godot/native
          --target macos-arm64
      - name: Locked managed restore, build, and tests
        env:
          SCGS_NATIVE_LIBRARY: ${{ github.workspace }}/build/stage-macos/lib/libscgs_v04.dylib
          SCGS_V04_NATIVE_PATH: ${{ github.workspace }}/build/stage-macos/lib/libscgs_v04.dylib
        run: python scripts/ci/run_managed_gate3.py
      - name: Godot headless import
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        run: >-
          python scripts/ci/run_with_timeout.py
          --timeout 180
          --forbid-output "SCRIPT ERROR:"
          --forbid-output "ERROR:"
          -- "$GODOT4" --headless
          --path client/godot --import
      - name: Godot default 3D current-project native smoke
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        run: |
          native="$(cd build/stage-macos/lib && pwd)/libscgs_v04.dylib"
          report="${RUNNER_TEMP}/gate4a-current-project-3d-macos.json"
          python scripts/ci/run_with_timeout.py \
            --timeout 180 \
            --expect-output SCGS_GODOT_CI_SMOKE_OK \
            --expect-output-count 1 \
            --forbid-output 'SCRIPT ERROR:' \
            --forbid-output 'ERROR:' \
            --forbid-output 'Unhandled exception' \
            -- "$GODOT4" --headless --path client/godot -- \
            --ci-smoke "--native-library=${native}" "--ci-report=${report}"
          python scripts/ci/validate_gate4a_report.py --report "$report" --scenario full-match --presentation 3d
      - name: Godot legacy 2D source regression smoke
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        run: |
          native="$(cd build/stage-macos/lib && pwd)/libscgs_v04.dylib"
          report="${RUNNER_TEMP}/gate4a-current-project-legacy-2d-macos.json"
          python scripts/ci/run_with_timeout.py \
            --timeout 180 \
            --expect-output SCGS_GODOT_CI_SMOKE_OK \
            --expect-output-count 1 \
            --forbid-output 'SCRIPT ERROR:' \
            --forbid-output 'ERROR:' \
            --forbid-output 'Unhandled exception' \
            -- "$GODOT4" --headless --path client/godot -- \
            --ci-smoke --legacy-2d-board "--native-library=${native}" "--ci-report=${report}"
          python scripts/ci/validate_gate4a_report.py --report "$report" --scenario full-match --presentation legacy-2d
      - name: Export, finalize, and sign macOS client
        env:
          GODOT4: ${{ steps.godot.outputs.godot }}
        run: |
          export_directory="${GITHUB_WORKSPACE}/artifacts/godot/macos-arm64"
          app="${export_directory}/SomeCardGameShit.app"
          mkdir -p "$export_directory"
          python scripts/ci/run_with_timeout.py \
            --timeout 600 \
            --forbid-output "SCRIPT ERROR:" \
            --forbid-output "ERROR:" \
            -- "$GODOT4" --headless --path client/godot \
            --export-release "macOS Apple Silicon" "$app"
          python scripts/ci/finalize_godot_export.py \
            --platform macos-arm64 \
            --export "$app" \
            --native-library build/stage-macos/lib/libscgs_v04.dylib
          codesign --force --sign - "$app/Contents/Frameworks/libscgs_v04.dylib"
          codesign --force --deep --sign - "$app"
      - name: Audit and launch exported macOS default 3D client
        run: |
          export_directory="${GITHUB_WORKSPACE}/artifacts/godot/macos-arm64"
          app="${export_directory}/SomeCardGameShit.app"
          executable="$app/Contents/MacOS/SomeCardGameShit"
          report="${RUNNER_TEMP}/gate4a-export-3d-macos.json"
          python scripts/audit_godot_export.py --platform macos-arm64 --export "$app"
          python scripts/ci/run_with_timeout.py \
            --timeout 180 \
            --cwd "$export_directory" \
            --expect-output SCGS_GODOT_CI_SMOKE_OK \
            --expect-output-count 1 \
            --forbid-output 'SCRIPT ERROR:' \
            --forbid-output 'ERROR:' \
            --forbid-output 'Unhandled exception' \
            -- "$executable" --headless -- --ci-smoke "--ci-report=${report}"
          python scripts/ci/validate_gate4a_report.py --report "$report" --scenario full-match --presentation 3d
      - name: Package macOS client
        run: |
          mkdir -p artifacts/packages
          ditto -c -k --sequesterRsrc --keepParent \
            artifacts/godot/macos-arm64/SomeCardGameShit.app \
            artifacts/packages/SomeCardGameShit-gate4b-r2-macos-arm64.app.zip
      - name: Round-trip audit and launch packaged macOS default 3D client
        run: |
          package="${GITHUB_WORKSPACE}/artifacts/packages/SomeCardGameShit-gate4b-r2-macos-arm64.app.zip"
          round_trip="${GITHUB_WORKSPACE}/artifacts/roundtrip/macos-arm64"
          mkdir -p "$round_trip"
          ditto -x -k "$package" "$round_trip"
          app="$round_trip/SomeCardGameShit.app"
          executable="$app/Contents/MacOS/SomeCardGameShit"
          report="${RUNNER_TEMP}/gate4a-roundtrip-3d-macos.json"
          python scripts/audit_godot_export.py --platform macos-arm64 --export "$app"
          python scripts/ci/run_with_timeout.py \
            --timeout 180 \
            --cwd "$round_trip" \
            --expect-output SCGS_GODOT_CI_SMOKE_OK \
            --expect-output-count 1 \
            --forbid-output 'SCRIPT ERROR:' \
            --forbid-output 'ERROR:' \
            --forbid-output 'Unhandled exception' \
            -- "$executable" --headless -- --ci-smoke "--ci-report=${report}"
          python scripts/ci/validate_gate4a_report.py --report "$report" --scenario full-match --presentation 3d
          shasum -a 256 "$package" | awk '{print "package_sha256=" $1}'
      - name: Check patch whitespace
        run: git diff --check
      - uses: actions/upload-artifact@v7
        with:
          name: SomeCardGameShit-gate4b-r2-macos-arm64
          path: artifacts/packages/SomeCardGameShit-gate4b-r2-macos-arm64.app.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: scgs-native-v04-macos-arm64-appleclang
          path: build/stage-macos
          if-no-files-found: error
